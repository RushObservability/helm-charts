name: rush-local

# Local Rush stack. The three unprofiled services are the minimum product:
# ClickHouse, query-api, and the frontend. Optional services use Compose
# profiles so `docker compose up` stays small and predictable.

x-demo-app: &demo-app
  image: ghcr.io/rushobservability/example-app:0.1.0
  profiles: [demo, all]
  restart: unless-stopped
  depends_on:
    otel-collector:
      condition: service_started

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rushdev}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-rush-local-clickhouse-password}
      CLICKHOUSE_READ_PASSWORD: ${CLICKHOUSE_READ_PASSWORD:-rush-local-read-password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse-local-storage.xml:/etc/clickhouse-server/config.d/rush-local-storage.xml:ro
      - ./config/clickhouse-security.xml:/etc/clickhouse-server/config.d/rush-security.xml:ro
      - ./config/clickhouse-users.xml:/etc/clickhouse-server/users.d/rush-read-user.xml:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  spool-init:
    image: busybox:1.36.1
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        chown -R 999:999 /var/lib/rush/spool /var/lib/rush/audit-spool &&
        chmod 0700 /var/lib/rush/spool /var/lib/rush/audit-spool
    volumes:
      - rush_spool:/var/lib/rush/spool
      - rush_audit_spool:/var/lib/rush/audit-spool
    restart: "no"

  query-api:
    image: ghcr.io/rushobservability/query-api:0.1.2
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rushdev}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-rush-local-clickhouse-password}
      CLICKHOUSE_READ_USER: rushquery
      CLICKHOUSE_READ_PASSWORD: ${CLICKHOUSE_READ_PASSWORD:-rush-local-read-password}
      RUSH_ENVIRONMENT: development
      RUSH_BASE_URL: ${RUSH_BASE_URL:-http://localhost:5173}
      RUSH_ALLOWED_ORIGINS: ${RUSH_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      RUSH_INSECURE_COOKIES: "true"
      # The bundled otel-collector and vector configs send no credentials, so the
      # default tenant's stored ingest_auth_required=1 would 403 every signal and
      # the telemetry/demo/all profiles would show no data. This is the documented
      # dev override (query-api logs a loud INSECURE warning). Set to "false" and
      # give the collectors an ingest-only API key to exercise real ingest auth.
      RUSH_ALLOW_ANONYMOUS_DEFAULT: ${RUSH_ALLOW_ANONYMOUS_DEFAULT:-true}
      RUSH_ALLOW_INSECURE_TENANT_READS: "false"
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-rush-admin123}
      RUSH_LICENSE_KEY: ${RUSH_LICENSE_KEY:-}
      RUSH_API_KEY_SECRET: ${RUSH_API_KEY_SECRET:-rush-local-api-key-secret-32-bytes}
      RUSH_SESSION_HMAC_SECRET: ${RUSH_SESSION_HMAC_SECRET:-rush-local-session-hmac-secret-32-bytes}
      RUSH_AUDIT_HMAC_SECRET: ${RUSH_AUDIT_HMAC_SECRET:-rush-local-audit-hmac-secret-32-bytes}
      RUSH_LOGIN_RATE_LIMIT_SECRET: ${RUSH_LOGIN_RATE_LIMIT_SECRET:-rush-local-login-rate-secret-32-bytes}
      RUSH_SSO_TRANSACTION_SECRET: ${RUSH_SSO_TRANSACTION_SECRET:-rush-local-sso-transaction-secret-32-bytes}
      RUSH_CONFIG_ENCRYPTION_KEY: ${RUSH_CONFIG_ENCRYPTION_KEY:-rush-local-config-encryption-key-32-bytes}
      RUSH_INTEGRATION_ENCRYPTION_KEY: ${RUSH_INTEGRATION_ENCRYPTION_KEY:-rush-local-integration-key-32-bytes}
      RUSH_SPOOL_DIR: /var/lib/rush/spool
      RUSH_AUDIT_SPOOL_DIR: /var/lib/rush/audit-spool
      SRE_AGENT_URL: http://sre-agent:8081
      SRE_AGENT_INTERNAL_TOKEN: ${SRE_AGENT_INTERNAL_TOKEN:-rush-local-sre-agent-internal-token}
      RUST_LOG: ${RUSH_API_LOG:-rush_api=info,tower_http=info}
    volumes:
      - rush_spool:/var/lib/rush/spool
      - rush_audit_spool:/var/lib/rush/audit-spool
    ports:
      - "127.0.0.1:${RUSH_API_PORT:-8080}:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      spool-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ghcr.io/rushobservability/frontend:0.1.8
    environment:
      QUERY_API_HOST: query-api:8080
      API_PUBLIC_URL: http://localhost:${RUSH_API_PORT:-8080}
      DEFAULT_THEME: ${DEFAULT_THEME:-light}
      RUSH_ENVIRONMENT: development
    ports:
      - "127.0.0.1:${RUSH_FRONTEND_PORT:-5173}:8080"
    depends_on:
      query-api:
        condition: service_healthy
    restart: unless-stopped

  # Receives OTLP traces, metrics, and logs. The demo applications use gRPC;
  # other local applications can use the published gRPC or HTTP ports.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: [telemetry, demo, all]
    environment:
      RUSH_API_ENDPOINT: http://query-api:8080
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      query-api:
        condition: service_healthy
    restart: unless-stopped

  # Sends container stdout/stderr as Rush logs and reports Vector's own
  # internal metrics through Prometheus remote write.
  vector:
    image: timberio/vector:0.56.0-distroless-libc
    profiles: [telemetry, demo, all]
    environment:
      RUSH_API_ENDPOINT: http://query-api:8080
    volumes:
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      query-api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    <<: *demo-app
    command: [node, --require, ./tracing.js, gateway.js]
    environment:
      SERVICE_NAME: gateway
      SERVICE_VERSION: 0.2.0
      PORT: "3000"
      ARTICLES_URL: http://articles:3001
      NOTIFICATIONS_URL: http://notifications:3002
      USERS_URL: http://users:3003
      PAYMENTS_URL: http://payments:3004
      MEDIA_URL: http://media:3005
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUSH_LOG_EVENTS: "true"
    ports:
      - "127.0.0.1:${DEMO_GATEWAY_PORT:-3000}:3000"
    depends_on:
      otel-collector:
        condition: service_started
      articles:
        condition: service_started
      notifications:
        condition: service_started
      users:
        condition: service_started
      payments:
        condition: service_started
      media:
        condition: service_started

  articles:
    <<: *demo-app
    command: [node, --require, ./tracing.js, articles.js]
    environment:
      SERVICE_NAME: articles
      SERVICE_VERSION: 0.2.0
      PORT: "3001"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUSH_LOG_EVENTS: "true"

  notifications:
    <<: *demo-app
    command: [node, --require, ./tracing.js, notifications.js]
    environment:
      SERVICE_NAME: notifications
      SERVICE_VERSION: 0.2.0
      PORT: "3002"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUSH_LOG_EVENTS: "true"

  users:
    <<: *demo-app
    command: [node, --require, ./tracing.js, users.js]
    environment:
      SERVICE_NAME: users
      SERVICE_VERSION: 0.2.0
      PORT: "3003"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUSH_LOG_EVENTS: "true"

  payments:
    <<: *demo-app
    command: [node, --require, ./tracing.js, payments.js]
    environment:
      SERVICE_NAME: payments
      SERVICE_VERSION: 0.2.0
      PORT: "3004"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUSH_LOG_EVENTS: "true"

  media:
    <<: *demo-app
    command: [node, --require, ./tracing.js, media.js]
    environment:
      SERVICE_NAME: media
      SERVICE_VERSION: 0.2.0
      PORT: "3005"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RUSH_LOG_EVENTS: "true"

  traffic:
    image: ghcr.io/rushobservability/example-app:0.1.0
    profiles: [demo, all]
    command:
      - node
      - generate-traffic.js
      - ${DEMO_REQUESTS_PER_SECOND:-5}
      - ${DEMO_DURATION_SECONDS:-3600}
    environment:
      GATEWAY_URL: http://gateway:3000
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  sre-agent:
    image: ghcr.io/rushobservability/sre-agent:0.1.1
    profiles: [sre, all]
    environment:
      SRE_AGENT_PORT: "8081"
      QUERY_API_URL: ${QUERY_API_URL:-http://query-api:8080}
      SRE_AGENT_INTERNAL_TOKEN: ${SRE_AGENT_INTERNAL_TOKEN:-rush-local-sre-agent-internal-token}
      SRE_AGENT_MAX_CONCURRENT_INVESTIGATIONS: ${SRE_AGENT_MAX_CONCURRENT_INVESTIGATIONS:-4}
      SRE_AGENT_MAX_QUEUED_INVESTIGATIONS: ${SRE_AGENT_MAX_QUEUED_INVESTIGATIONS:-16}
      SRE_AGENT_MAX_TOOL_STEPS: ${SRE_AGENT_MAX_TOOL_STEPS:-40}
      SRE_AGENT_MAX_LLM_CALLS: ${SRE_AGENT_MAX_LLM_CALLS:-55}
      SRE_AGENT_RUNTIME_METRICS_INTERVAL_SECS: ${SRE_AGENT_RUNTIME_METRICS_INTERVAL_SECS:-15}
      RUST_LOG: ${SRE_AGENT_LOG:-sre_agent=info,tower_http=info}
    ports:
      - "127.0.0.1:${SRE_AGENT_PORT:-8081}:8081"
    depends_on:
      query-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse_data:
  rush_spool:
  rush_audit_spool:
