# Apply this file to rush-observability-stack. The chart generates and
# registers its shared ingest key automatically.
rush-observability:
  queryApi:
    replicas: 1
  clickhouse:
    mode: operator

global:
  sreAgent:
    enabled: false

# OTel handles traces and metrics; Vector tails Kubernetes container logs.
collectors:
  mode: hybrid
  otel:
    signals:
      traces: true
      metrics: true
      logs: false
  vector:
    mode: logs

metricsAgent:
  enabled: true
  extraLabels:
    env: dev
