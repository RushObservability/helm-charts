# Apply this file to rush-observability-stack. The chart generates and
# registers its shared ingest key automatically.
rush:
  queryApi:
    replicas: 1
    config:
      integrations:
        sreAgent:
          enabled: false
  clickhouse:
    enabled: true
    mode: operator

# OTel handles traces and metrics; Vector tails Kubernetes container logs.
collectors:
  mode: hybrid
  otel:
    signals:
      traces: true
      metrics: true
      logs: false
  vector:
    mode: logs

metricsAgent:
  enabled: true
  extraLabels:
    env: dev
