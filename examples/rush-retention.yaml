#     tiering:
#       metrics_move_after_days: 30   # keep metrics hot longer for dashboards
#       traces_move_after_days: 7
#       logs_move_after_days: 30
#
# queryApi:
#   config:
#     retention:
#       defaults:
#         metricsDays: 730    # 2 years default (SOC2 / HIPAA baseline)
#         tracesDays: 365     # 1 year of traces
#         logsDays: 365
#       metrics:
#         - nameRegex: ".*_scrape_.*"
#           retainDays: 30
#       traces:
