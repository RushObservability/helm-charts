name: Release Helm Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: changed
        run: |
          # Get changed files between this commit and previous
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- charts/)

          # Extract unique chart directories (first level under charts/)
          CHARTS=$(echo "$CHANGED" \
            | grep '^charts/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed charts: $CHARTS"
          echo "charts=$CHARTS" >> "$GITHUB_OUTPUT"

  package-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]' && needs.detect-changes.outputs.charts != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect-changes.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build dependencies (if not vendored)
        run: |
          CHART_DIR="charts/${{ matrix.chart }}"
          if [ "${{ matrix.chart }}" = "rush-observability-stack" ]; then
            helm repo add altinity https://helm.altinity.com || true
            helm dependency build charts/rush-observability
          fi
          if [ -f "$CHART_DIR/Chart.lock" ] && ls "$CHART_DIR"/charts/*.tgz 1>/dev/null 2>&1; then
            echo "Dependencies already vendored, skipping build"
          else
            helm repo add altinity https://helm.altinity.com || true
            helm dependency build "$CHART_DIR"
          fi

      - name: Lint chart
        run: helm lint --strict charts/${{ matrix.chart }}

      - name: Require a chart version bump
        run: |
          CHART_DIR="charts/${{ matrix.chart }}"
          OLD_VERSION=$(git show "HEAD~1:${CHART_DIR}/Chart.yaml" 2>/dev/null | awk '/^version:/ { print $2; exit }' || true)
          NEW_VERSION=$(awk '/^version:/ { print $2; exit }' "$CHART_DIR/Chart.yaml")
          if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "$CHART_DIR changed but version remains $NEW_VERSION" >&2
            exit 1
          fi

      - name: Run render security tests
        run: |
          for test in charts/${{ matrix.chart }}/tests/*.sh; do
            [ -f "$test" ] || continue
            bash "$test"
          done

      - name: Extract chart version
        id: meta
        run: |
          VERSION=$(grep '^version:' charts/${{ matrix.chart }}/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package charts/${{ matrix.chart }} --destination .pkg

      - name: Validate packaged archive
        run: |
          PKG=$(find .pkg -maxdepth 1 -name '${{ matrix.chart }}-*.tgz' -print -quit)
          helm show chart "$PKG" >/dev/null
          helm template packaged "$PKG" >/dev/null
          tar -tzf "$PKG" > .pkg/manifest.txt
          if grep -q '/tests/' .pkg/manifest.txt; then
            echo "Published chart unexpectedly contains repository tests" >&2
            exit 1
          fi

      - name: Push to GHCR
        run: |
          PKG=$(ls .pkg/*.tgz)
          helm push "$PKG" oci://ghcr.io/${{ steps.owner.outputs.name }}/helm-charts
          echo "Pushed $PKG"

      - name: Summary
        run: |
          echo "### Published \`${{ matrix.chart }}\` v${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "helm install ${{ matrix.chart }} oci://ghcr.io/${{ steps.owner.outputs.name }}/helm-charts/${{ matrix.chart }} --version ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
