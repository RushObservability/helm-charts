name: Helm security and quality

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint chart
        run: helm lint charts/rushobservability

      - name: Run render security tests
        run: |
          for test in charts/rushobservability/tests/*.sh; do
            bash "$test"
          done
