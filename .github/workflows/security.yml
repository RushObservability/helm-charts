name: Helm security and quality

on:
  pull_request:
    paths:
      - "charts/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Build missing chart dependencies
        run: |
          for chart in charts/*; do
            [ -f "$chart/Chart.lock" ] || continue
            if helm dependency list "$chart" | awk 'NR > 1 && NF && $NF != "ok" { bad=1 } END { exit bad }'; then
              continue
            fi
            helm repo add altinity https://helm.altinity.com || true
            helm dependency build "$chart"
          done

      - name: Lint charts
        run: |
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm lint --strict "$chart"
          done

      - name: Require a chart version bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$PUSH_BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "No comparable base commit; skipping version comparison"
            exit 0
          fi
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            if git diff --quiet "$BASE_SHA" HEAD -- "$chart"; then
              continue
            fi
            OLD_VERSION=$(git show "$BASE_SHA:$chart/Chart.yaml" 2>/dev/null | awk '/^version:/ { print $2; exit }' || true)
            NEW_VERSION=$(awk '/^version:/ { print $2; exit }' "$chart/Chart.yaml")
            if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "$chart changed but version remains $NEW_VERSION" >&2
              exit 1
            fi
            echo "$chart version changed: ${OLD_VERSION:-new} -> $NEW_VERSION"
          done

      - name: Run render tests
        run: |
          for test_dir in charts/*/tests; do
            [ -d "$test_dir" ] || continue
            for test in "$test_dir"/*.sh; do
              [ -f "$test" ] || continue
              bash "$test"
            done
          done

      - name: Validate packaged archive
        run: |
          mkdir -p .pkg
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            name=$(awk '/^name:/ { print $2; exit }' "$chart/Chart.yaml")
            helm package "$chart" --destination .pkg
            PKG=$(find .pkg -maxdepth 1 -name "$name-*.tgz" -print -quit)
            helm show chart "$PKG" >/dev/null
            helm template packaged "$PKG" >/dev/null
            tar -tzf "$PKG" > ".pkg/$name-manifest.txt"
            if grep -q '/tests/' ".pkg/$name-manifest.txt"; then
              echo "$name package unexpectedly contains repository tests" >&2
              exit 1
            fi
          done
