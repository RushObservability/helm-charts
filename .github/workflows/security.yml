name: Helm security and quality

on:
  # No path filter here on purpose. This job is a required status check, and a
  # required check that is skipped never reports, leaving the pull request
  # stuck on "Expected - waiting for status to be reported". Push keeps its
  # filter, where skipping is harmless.
  pull_request:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build missing chart dependencies
        run: |
          for chart in charts/*; do
            [ -f "$chart/Chart.lock" ] || continue
            if helm dependency list "$chart" | awk 'NR > 1 && NF && $NF != "ok" { bad=1 } END { exit bad }'; then
              continue
            fi
            helm repo add altinity https://helm.altinity.com || true
            helm dependency build "$chart"
          done

      - name: Check chart READMEs are up to date
        # helm-docs regenerates every chart README from Chart.yaml and the
        # `# --` comments in values.yaml. If the committed README differs, the
        # values table has drifted from the values file.
        run: |
          curl -fsSL -o /tmp/helm-docs.tar.gz \
            https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          echo "a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc  /tmp/helm-docs.tar.gz" | sha256sum -c - || {
            echo "::error::helm-docs checksum mismatch"; exit 1; }
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          /tmp/helm-docs --chart-search-root=charts
          if ! git diff --exit-code -- 'charts/*/README.md'; then
            echo "::error::Chart READMEs are stale. Run: helm-docs --chart-search-root=charts"
            exit 1
          fi

      - name: Lint charts
        run: |
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm lint --strict "$chart"
          done

      - name: Require a chart version bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$PUSH_BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then
            echo "No comparable base commit; skipping version comparison"
            exit 0
          fi
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            if git diff --quiet "$BASE_SHA" HEAD -- "$chart"; then
              continue
            fi
            OLD_VERSION=$(git show "$BASE_SHA:$chart/Chart.yaml" 2>/dev/null | awk '/^version:/ { print $2; exit }' || true)
            NEW_VERSION=$(awk '/^version:/ { print $2; exit }' "$chart/Chart.yaml")
            if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              echo "$chart changed but version remains $NEW_VERSION" >&2
              exit 1
            fi
            echo "$chart version changed: ${OLD_VERSION:-new} -> $NEW_VERSION"
          done

      - name: Run render tests
        run: |
          for test_dir in charts/*/tests; do
            [ -d "$test_dir" ] || continue
            for test in "$test_dir"/*.sh; do
              [ -f "$test" ] || continue
              bash "$test"
            done
          done

      - name: Validate packaged archive
        run: |
          mkdir -p .pkg
          for chart in charts/*; do
            [ -f "$chart/Chart.yaml" ] || continue
            name=$(awk '/^name:/ { print $2; exit }' "$chart/Chart.yaml")
            helm package "$chart" --destination .pkg
            PKG=$(find .pkg -maxdepth 1 -name "$name-*.tgz" -print -quit)
            helm show chart "$PKG" >/dev/null
            helm template packaged "$PKG" >/dev/null
            tar -tzf "$PKG" > ".pkg/$name-manifest.txt"
            if grep -q '/tests/' ".pkg/$name-manifest.txt"; then
              echo "$name package unexpectedly contains repository tests" >&2
              exit 1
            fi
          done
