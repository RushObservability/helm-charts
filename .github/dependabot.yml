version: 2

updates:
  # Helm chart dependencies declared in each Chart.yaml. Today that is the
  # altinity clickhouse subchart in rush-observability; the file:// deps in
  # rush-observability-stack are local paths and are not updatable.
  #
  # Note this ecosystem tracks Chart.yaml dependencies, NOT the container image
  # tags pinned in values.yaml -- those still need bumping by hand.
  - package-ecosystem: helm
    directories:
      - /charts/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    # Wait before proposing a new release, so a compromised or quickly
    # withdrawn version is less likely to land here.
    cooldown:
      default-days: 7

  # Actions in .github/workflows. These are SHA-pinned; Dependabot bumps the
  # SHA and keeps the trailing "# vX.Y.Z" comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
