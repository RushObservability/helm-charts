queryApi:
  environment: development
  scheduling:
    nodeSelector:
      nodegroup: query-api

frontend:
  inheritGlobalScheduling: false
  scheduling:
    nodeSelector:
      nodegroup: frontend-only

anomalyEngine:
  enabled: true

global:
  scheduling:
    nodeSelector:
      nodegroup: rush-apps
      topology-zone: west
    tolerations:
      - key: rush-apps
        operator: Exists
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
                - key: capacity
                  operator: In
                  values: [on-demand]
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: scheduling

clickhouse:
  keeper:
    enabled: true
    nodeSelector:
      nodegroup: clickhouse
  clickhouse:
    nodeSelector:
      nodegroup: clickhouse
  operator:
    nodeSelector:
      nodegroup: rush-apps
    crdHook:
      nodeSelector:
        nodegroup: rush-apps
