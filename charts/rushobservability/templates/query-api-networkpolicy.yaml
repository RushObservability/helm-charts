{{- if .Values.queryApi.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.queryApiServiceName" . }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "query-api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
        {{- if include "rush.otelEnabled" . }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
        {{- end }}
        {{- if include "rush.vectorEnabled" . }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "vector") | nindent 14 }}
        {{- end }}
        {{- if .Values.enterprise.license.integrations.postgresCollector.enabled }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "postgres-collector") | nindent 14 }}
        {{- end }}
        {{- if .Values.helmTests.enabled }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "helm-test") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
    {{- with .Values.queryApi.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
    {{- if .Values.sreAgent.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
    {{- if .Values.queryApi.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.queryApi.networkPolicy.allowExternalClickHouseEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9440
    {{- end }}
    {{- if .Values.queryApi.networkPolicy.allowSmtpEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
    {{- end }}
    {{- with .Values.queryApi.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if and .Values.queryApi.networkPolicy.enabled .Values.queryApi.buffer.drainWorker.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "query-api-drain-worker") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "query-api-drain-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "query-api-drain-worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
    {{- if .Values.queryApi.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.queryApi.networkPolicy.allowExternalClickHouseEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9440
    {{- end }}
    {{- with .Values.queryApi.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
