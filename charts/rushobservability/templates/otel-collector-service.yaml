{{- if include "rush.otelEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "otel-collector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  type: {{ .Values.collectors.otel.service.type }}
  selector:
    {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.collectors.otel.service.grpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.collectors.otel.service.httpPort }}
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
{{- end }}
