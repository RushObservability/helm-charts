{{- if .Values.frontend.serviceAccount.create }}
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.frontend "component" "frontend") }}
---
{{- end }}
{{- if and .Values.anomalyEngine.enabled .Values.anomalyEngine.serviceAccount.create }}
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.anomalyEngine "component" "anomaly-engine") }}
---
{{- end }}
{{- if and .Values.enterprise.license.integrations.postgresCollector.enabled .Values.enterprise.license.integrations.postgresCollector.serviceAccount.create }}
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.enterprise.license.integrations.postgresCollector "component" "postgres-collector") }}
---
{{- end }}
{{- if and (include "rush.otelEnabled" .) .Values.collectors.otel.serviceAccount.create }}
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.collectors.otel "component" "otel-collector") }}
---
{{- end }}
{{- if and .Values.queryApi.buffer.drainWorker.enabled .Values.queryApi.buffer.drainWorker.serviceAccount.create }}
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.queryApi.buffer.drainWorker "component" "query-api-drain-worker") }}
---
{{- end }}
{{- if and (eq .Values.clickhouse.mode "standalone") .Values.clickhouseStandalone.serviceAccount.create }}
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.clickhouseStandalone "component" "clickhouse") }}
{{- end }}
