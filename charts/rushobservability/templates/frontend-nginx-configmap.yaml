apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rush.fullname" . }}-frontend-nginx
  labels:
    app.kubernetes.io/component: frontend
    {{- include "rush.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
        listen {{ .Values.frontend.containerPort | default 8080 }};
        server_tokens off;

        # nginx-security-headers.conf is baked into the frontend image. Helm
        # deliberately consumes that canonical policy instead of copying CSP.
        # HSTS belongs at the TLS-terminating ingress; see NOTES.txt.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /runtime-config.js {
            alias /tmp/nginx-runtime/runtime-config.js;
            default_type application/javascript;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
            root /usr/share/nginx/html;
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable";
        }

        location /api/ {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://${QUERY_API_HOST}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://${QUERY_API_HOST}/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /prom/ {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://${QUERY_API_HOST}/prom/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /metrics {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://${QUERY_API_HOST}/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
