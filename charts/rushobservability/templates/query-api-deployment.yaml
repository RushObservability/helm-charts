apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.queryApiServiceName" . }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "query-api") | nindent 4 }}
spec:
  replicas: {{ .Values.queryApi.replicas }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 8 }}
      annotations:
        checksum/rush-config: {{ include (print $.Template.BasePath "/rush-config-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "rush.fullname" . }}-query-api
      terminationGracePeriodSeconds: {{ .Values.queryApi.terminationGracePeriodSeconds | default 120 }}
      automountServiceAccountToken: {{ or .Values.kubernetes.enabled .Values.argocd.enabled .Values.fluxcd.enabled }}
      securityContext:
        runAsNonRoot: true
        # Matches the appgroup created by query-api/Dockerfile and grants it
        # write access only to the dedicated spool volume.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query-api
          image: {{ include "rush.image" (dict "image" .Values.queryApi.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.queryApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.queryApi.port }}
          env:
            {{- include "rush.clickhouseWriteEnv" . | nindent 12 }}
            {{- include "rush.clickhouseReadEnv" . | nindent 12 }}
            - name: RUSH_CONFIG
              value: /etc/rush/rush.toml
            - name: RUSH_ENVIRONMENT
              value: {{ .Values.queryApi.environment | quote }}
            - name: RUSH_BASE_URL
              value: {{ .Values.queryApi.baseUrl | quote }}
            - name: RUSH_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.queryApi.trustedProxyCidrs | quote }}
            - name: RUSH_QUERY_API_REPLICAS
              value: {{ .Values.queryApi.replicas | quote }}
            - name: RUSH_SSO_REPLAY_STORE
              value: {{ .Values.queryApi.ssoReplayStore | quote }}
            - name: RUSH_LOGIN_ACCOUNT_LIMIT_PER_MINUTE
              value: {{ .Values.queryApi.loginRateLimit.accountPerMinute | quote }}
            - name: RUSH_LOGIN_IP_LIMIT_PER_MINUTE
              value: {{ .Values.queryApi.loginRateLimit.ipPerMinute | quote }}
            - name: RUSH_INGEST_MAX_COMPRESSED_BYTES
              value: {{ .Values.queryApi.ingestLimits.maxCompressedBytes | quote }}
            - name: RUSH_INGEST_MAX_DECOMPRESSED_BYTES
              value: {{ .Values.queryApi.ingestLimits.maxDecompressedBytes | quote }}
            - name: RUSH_INGEST_MAX_ENTITIES
              value: {{ .Values.queryApi.ingestLimits.maxEntities | quote }}
            - name: RUSH_INGEST_MAX_SERIES
              value: {{ .Values.queryApi.ingestLimits.maxSeries | quote }}
            - name: RUSH_INGEST_MAX_SAMPLES
              value: {{ .Values.queryApi.ingestLimits.maxSamples | quote }}
            - name: RUSH_INGEST_MAX_METADATA
              value: {{ .Values.queryApi.ingestLimits.maxMetadata | quote }}
            - name: RUSH_INGEST_MAX_LABELS_PER_SERIES
              value: {{ .Values.queryApi.ingestLimits.maxLabelsPerSeries | quote }}
            - name: RUSH_INGEST_MAX_LABEL_NAME_BYTES
              value: {{ .Values.queryApi.ingestLimits.maxLabelNameBytes | quote }}
            - name: RUSH_INGEST_MAX_LABEL_VALUE_BYTES
              value: {{ .Values.queryApi.ingestLimits.maxLabelValueBytes | quote }}
            - name: RUSH_INGEST_DECODE_CONCURRENCY
              value: {{ .Values.queryApi.ingestLimits.decodeConcurrency | quote }}
            - name: RUSH_SESSION_IDLE_TIMEOUT_SECS
              value: {{ .Values.queryApi.session.idleTimeoutSeconds | quote }}
            - name: RUSH_SESSION_ABSOLUTE_TIMEOUT_SECS
              value: {{ .Values.queryApi.session.absoluteTimeoutSeconds | quote }}
            - name: RUSH_SESSION_RENEWAL_INTERVAL_SECS
              value: {{ .Values.queryApi.session.renewalIntervalSeconds | quote }}
            - name: RUSH_ALLOW_ANONYMOUS_DEFAULT
              value: {{ .Values.queryApi.allowAnonymousDefault | quote }}
            - name: RUSH_SPOOL_DIR
              value: /var/lib/rush/spool
            - name: RUSH_AUDIT_SPOOL_DIR
              value: /var/lib/rush/audit-spool
            - name: RUSH_AUDIT_SPOOL_MAX_BYTES
              value: {{ .Values.queryApi.audit.spool.maxBytes | quote }}
            - name: RUSH_AUDIT_HMAC_KEY_ID
              value: {{ .Values.queryApi.audit.keyId | quote }}
            # Run the anomaly engine in-process only when there is no dedicated
            # anomaly-engine Deployment, so rules aren't evaluated twice.
            - name: RUSH_RUN_ANOMALY_ENGINE
              value: {{ not .Values.anomalyEngine.enabled | quote }}
            # Emit cadence for internal rush_stats_* gauges (15s keeps rate() usable).
            - name: RUSH_STATS_INTERVAL_SECS
              value: {{ .Values.statsEngine.intervalSecs | default 15 | quote }}
            # PromQL staleness/lookback: how long a metric's last value carries forward.
            - name: RUSH_PROM_LOOKBACK_SECS
              value: {{ .Values.promql.lookbackSecs | default 300 | quote }}
            # Operator-owned group -> tenant -> Kubernetes namespace boundary.
            # Empty/missing tenant entries deny infrastructure reads.
            - name: RUSH_INFRASTRUCTURE_TENANT_NAMESPACES
              value: {{ .Values.infrastructure.tenantNamespaces | toJson | quote }}
            {{- if .Values.argocd.enabled }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocd.namespace | quote }}
            {{- end }}
            {{- if .Values.fluxcd.enabled }}
            - name: FLUXCD_NAMESPACE
              value: {{ .Values.fluxcd.namespace | quote }}
            {{- end }}
            {{- if .Values.kubernetes.enabled }}
            - name: KUBERNETES_ENABLED
              value: "true"
            - name: KUBERNETES_CLUSTER_WIDE
              value: {{ .Values.kubernetes.clusterWide | quote }}
            {{- end }}
            {{- if .Values.cloudwatch.enabled }}
            - name: CLOUDWATCH_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.sreAgent.enabled }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sreAgent.llmApiKeySecret.name }}
                  key: {{ .Values.sreAgent.llmApiKeySecret.key }}
            # query-api fronts the SRE agent: it authenticates + injects the
            # caller's tenant, then forwards /investigate, /sessions, and
            # /investigation-templates to the agent at this URL.
            - name: SRE_AGENT_URL
              value: {{ include "rush.sreAgentUrl" . | quote }}
            {{- if .Values.sreAgent.githubApp.enabled }}
            # The API uses the same operator-owned policy as the agent so
            # browser callers can never choose installation/repository IDs.
            - name: SRE_AGENT_GITHUB_REPOSITORY_POLICY
              value: {{ .Values.sreAgent.githubApp.tenantRepositories | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.enterprise.license.enabled }}
            # Commercial license (Ed25519-signed token), verified offline by the API.
            - name: RUSH_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enterprise.license.secret.name }}
                  key: {{ .Values.enterprise.license.secret.key }}
            {{- end }}
            {{- $bootstrapSecret := .Values.queryApi.existingSecret | default (printf "%s-bootstrap" (include "rush.fullname" .)) }}
            # First-boot admin seed + audit-log HMAC key. Auto-generated and
            # preserved across upgrades by query-api-secret.yaml (or supply your
            # own via queryApi.existingSecret). Never hard-code these in values.
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: initial-admin-password
            - name: RUSH_AUDIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: audit-hmac-secret
            - name: RUSH_AUDIT_HMAC_PREVIOUS_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: audit-hmac-previous-keys
                  optional: true
            - name: RUSH_SESSION_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: session-hmac-secret
                  optional: true
            - name: RUSH_SSO_TRANSACTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: sso-transaction-secret
            - name: RUSH_CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: config-encryption-key
            {{- if .Values.sreAgent.enabled }}
            - name: SRE_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: sre-agent-internal-token
            {{- end }}
            {{- range $key, $val := .Values.queryApi.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            - name: rush-config
              mountPath: /etc/rush
              readOnly: true
            - name: rush-spool
              mountPath: /var/lib/rush/spool
            - name: audit-spool
              mountPath: /var/lib/rush/audit-spool
          resources:
            {{- toYaml .Values.queryApi.resources | nindent 12 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
          {{- if .Values.queryApi.gracefulShutdown.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    exec /usr/bin/curl --fail --silent --show-error --max-time 5
                    --request POST http://127.0.0.1:{{ .Values.queryApi.port }}/shutdown
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: rush-config
          configMap:
            name: {{ include "rush.fullname" . }}-rush-config
        - name: rush-spool
          emptyDir: {}
        - name: audit-spool
          {{- if .Values.queryApi.audit.spool.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.queryApi.audit.spool.persistence.existingClaim | default (printf "%s-query-api-audit" (include "rush.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
