apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-configmap.yaml") . | sha256sum }}
    spec:
      # The frontend serves static files and proxies /api. It needs no Kubernetes
      # API token. The Rush Chainguard image runs as uid 65532 and binds 8080.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "rush.image" (dict "image" .Values.frontend.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort | default 8080 }}
          env:
            - name: QUERY_API_HOST
              value: "{{ include "rush.queryApiServiceName" . }}:{{ .Values.queryApi.service.port }}"
            # Public base URL (scheme+host, no trailing slash) of the Rush API as
            # seen from outside the cluster, surfaced to the UI (e.g. the CloudWatch
            # ingest endpoint AWS Firehose posts to). Empty → UI uses its origin.
            - name: API_PUBLIC_URL
              value: "{{ .Values.frontend.apiBaseUrl | default "" }}"
            - name: RUSH_ENVIRONMENT
              value: "{{ .Values.queryApi.environment }}"
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "rush.componentName" (dict "root" . "component" "frontend-nginx") }}
        - name: runtime-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
