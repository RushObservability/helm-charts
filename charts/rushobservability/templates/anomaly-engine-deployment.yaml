{{- if .Values.anomalyEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "anomaly-engine") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "anomaly-engine") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "anomaly-engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "anomaly-engine") | nindent 8 }}
      annotations:
        checksum/rush-config: {{ include (print $.Template.BasePath "/rush-config-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- $image := mergeOverwrite (deepCopy .Values.queryApi.image) (deepCopy (.Values.anomalyEngine.image | default dict)) }}
        - name: anomaly-engine
          image: {{ include "rush.image" (dict "image" $image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $image.pullPolicy }}
          command: ["anomaly_engine"]
          env:
            {{- include "rush.clickhouseWriteEnv" . | nindent 12 }}
            {{- include "rush.clickhouseReadEnv" . | nindent 12 }}
            - name: RUSH_CONFIG
              value: /etc/rush/rush.toml
            {{- range $key, $val := .Values.anomalyEngine.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            - name: rush-config
              mountPath: /etc/rush
              readOnly: true
          resources:
            {{- toYaml .Values.anomalyEngine.resources | nindent 12 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
      volumes:
        - name: rush-config
          configMap:
            name: {{ include "rush.fullname" . }}-rush-config
{{- end }}
