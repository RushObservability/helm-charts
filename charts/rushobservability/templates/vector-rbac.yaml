{{- if include "rush.vectorEnabled" . }}
{{- if .Values.collectors.vector.serviceAccount.create }}
---
{{ include "rush.serviceAccount" (dict "root" . "workload" .Values.collectors.vector "component" "vector") }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rush.fullname" . }}-vector
  labels:
    app.kubernetes.io/component: vector
    {{- include "rush.labels" . | nindent 4 }}
rules:
  # kubernetes_logs source needs to discover pods and read their metadata.
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rush.fullname" . }}-vector
  labels:
    app.kubernetes.io/component: vector
    {{- include "rush.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rush.fullname" . }}-vector
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.collectors.vector "component" "vector") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
