{{- if .Values.argocd.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rush.fullname" . }}-argocd-reader
  namespace: {{ .Values.argocd.namespace | quote }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
rules:
  # This capability bundle grants only the CRDs used by the ArgoCD handlers.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rush.fullname" . }}-argocd-reader
  namespace: {{ .Values.argocd.namespace | quote }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rush.fullname" . }}-argocd-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.fullname" . }}-query-api
    namespace: {{ .Release.Namespace }}
{{- end }}
