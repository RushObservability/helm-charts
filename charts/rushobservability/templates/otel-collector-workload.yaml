{{- if include "rush.otelEnabled" . }}
{{- $isDaemonSet := eq .Values.collectors.otel.kind "daemonset" -}}
apiVersion: apps/v1
kind: {{ if $isDaemonSet }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "otel-collector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  {{- if and (not $isDaemonSet) (not .Values.collectors.otel.autoscaling.enabled) }}
  replicas: {{ .Values.collectors.otel.replicas }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: otel-collector
          image: {{ include "rush.image" (dict "image" .Values.collectors.otel.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.collectors.otel.image.pullPolicy }}
          args:
            - "--config=/etc/otelcol/collector.yaml"
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.collectors.otel.service.grpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.collectors.otel.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          {{- if .Values.collectors.ingestApiKeySecret.name }}
          env:
            - name: RUSH_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collectors.ingestApiKeySecret.name }}
                  key: {{ .Values.collectors.ingestApiKeySecret.key }}
          {{- else if not .Values.collectors.allowAnonymousIngest }}
          {{- fail "collectors.ingestApiKeySecret.name is required when an in-cluster collector is enabled" }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.collectors.otel.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "rush.componentName" (dict "root" . "component" "otel-collector") }}
            items:
              - key: collector.yaml
                path: collector.yaml
{{- end }}
