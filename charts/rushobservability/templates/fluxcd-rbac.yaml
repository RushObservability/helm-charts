{{- if .Values.fluxcd.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rush.fullname" . }}-fluxcd-reader
  namespace: {{ .Values.fluxcd.namespace | quote }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
rules:
  # This capability bundle grants only the CRDs used by the Flux handlers.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories", "helmcharts", "buckets"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rush.fullname" . }}-fluxcd-reader
  namespace: {{ .Values.fluxcd.namespace | quote }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rush.fullname" . }}-fluxcd-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.fullname" . }}-query-api
    namespace: {{ .Release.Namespace }}
{{- end }}
