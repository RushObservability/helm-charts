{{- if .Values.frontend.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.frontend.networkPolicy.allowSameNamespaceIngress }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
    {{- with .Values.frontend.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    {{- with .Values.frontend.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and .Values.anomalyEngine.enabled .Values.anomalyEngine.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "anomaly-engine") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "anomaly-engine") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "anomaly-engine") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with .Values.anomalyEngine.networkPolicy.extraIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    {{- if .Values.anomalyEngine.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- if .Values.anomalyEngine.networkPolicy.allowSmtpEgress }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 465 }
        - { protocol: TCP, port: 587 }
    {{- end }}
    {{- with .Values.anomalyEngine.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

