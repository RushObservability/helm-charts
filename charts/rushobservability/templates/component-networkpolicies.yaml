{{- if and (include "rush.vectorEnabled" .) .Values.collectors.vector.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "vector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "vector") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "vector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.collectors.vector.networkPolicy.allowSameNamespaceIngress }}
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8686 }
