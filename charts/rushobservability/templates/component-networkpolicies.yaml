        - { protocol: TCP, port: 4318 }
        {{- end }}
    {{- end }}
    {{- with .Values.collectors.vector.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: http }
    {{- if .Values.collectors.vector.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- with .Values.collectors.vector.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and (eq .Values.clickhouse.mode "standalone") .Values.clickhouseStandalone.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "clickhouse") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api-drain-worker") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "anomaly-engine") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "helm-test") | nindent 14 }}
      ports:
        - { protocol: TCP, port: http }
        - { protocol: TCP, port: tcp }
    {{- with .Values.clickhouseStandalone.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.clickhouseStandalone.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- with .Values.clickhouseStandalone.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
