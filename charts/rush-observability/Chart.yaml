apiVersion: v2
name: rush-observability
description: Core Rush observability platform with Query API, frontend, anomaly processing, and ClickHouse
version: 0.2.0
appVersion: 0.1.24
type: application
kubeVersion: ">=1.25.0-0"
home: https://rushobservability.com
icon: https://rushobservability.com/logos/rush-mark-512.png
sources:
  - https://github.com/RushObservability/helm-charts
  - https://github.com/RushObservability/query-api
  - https://github.com/RushObservability/frontend
maintainers:
  - name: Mike Zupan
    email: mike@zcentric.com
    url: https://github.com/mzupan
keywords:
  - observability
  - opentelemetry
  - prometheus
  - logs
  - metrics
  - tracing
  - clickhouse
annotations:
  artifacthub.io/license: BUSL-1.1

dependencies:
  - name: clickhouse
    version: "0.3.x"
    repository: https://helm.altinity.com
    condition: clickhouse.enabled
