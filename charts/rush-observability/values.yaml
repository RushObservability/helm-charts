# ── query-api ──
imageSecurity:
  # Recommended for every production values file. When enabled, the chart
  # refuses tag-only first-party Rush workloads.
  requireDigests: false

queryApi:
  # Inherit global.scheduling by default. Values under scheduling override the
  # global maps/lists; set this false to schedule this workload independently.
  inheritGlobalScheduling: true
  scheduling: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  priorityClassName: ""
  runtimeClassName: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  image:
    repository: mzupan/rush-api
    tag: "0.1.25"
    digest: "" # sha256:<64 hex chars>; takes precedence over tag
    pullPolicy: Always
  replicas: 1
  port: 8080
  rollout:
    strategy: RollingUpdate
    maxUnavailable: 0
    maxSurge: 1
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    revisionHistoryLimit: 10
  podDisruptionBudget:
    enabled: false
    type: maxUnavailable
    value: 1
  probes:
    startup:
      enabled: true
      path: /healthz
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 60
      successThreshold: 1
    readiness:
      enabled: true
      path: /readyz
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
  # The local disk queue is safe for one API pod. HA API replicas must share an
  # object-store queue and use exactly one dedicated drain worker.
  buffer:
    backend: disk                    # disk | object_store
    maxBytes: 2147483648
    objectStore:
      endpoint: ""                   # blank uses the S3 provider default
      bucket: ""
      prefix: ingest/
      region: us-east-1
      credentialsSecret:
        name: ""                     # existing Secret; required for object_store
        accessKeyKey: access-key
        secretKeyKey: secret-key
    drainWorker:
      enabled: false
      inheritGlobalScheduling: true
      scheduling: {}
      podAnnotations: {}
      podLabels: {}
      imagePullSecrets: []
      priorityClassName: ""
      runtimeClassName: ""
      extraEnvFrom: []
      extraVolumes: []
      extraVolumeMounts: []
      serviceAccount:
        create: false
        name: ""
        annotations: {}
      # Recreate is deliberate: the queue contract allows exactly one drainer.
      rollout:
        strategy: Recreate
        minReadySeconds: 0
        progressDeadlineSeconds: 600
        revisionHistoryLimit: 10
      podDisruptionBudget:
        enabled: false
        type: maxUnavailable
        value: 1
      terminationGracePeriodSeconds: 120
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
  # The preStop hook makes readiness fail before termination and lets query-api
  # flush in-memory batches plus drain its durable ingest queue. Increase this
  # for large backlogs or a ClickHouse recovery window.
  gracefulShutdown:
    enabled: true
  terminationGracePeriodSeconds: 120
  # ── Bootstrap secrets (admin password + API/audit/session HMAC keys) ──
  # Leave blank to AUTO-GENERATE on first install and preserve across upgrades
  # (stored in the <release>-bootstrap Secret — ArgoCD-style). Set a value to
  # pin/preset it, or point existingSecret at your own Secret to bring your own.
  adminPassword: ""        # INITIAL_ADMIN_PASSWORD — first-boot admin seed
  apiKeyHmacSecret: ""     # RUSH_API_KEY_SECRET — HMAC key for stored API-key hashes
  auditHmacSecret: ""      # RUSH_AUDIT_HMAC_SECRET — audit hash-chain key; MUST stay stable
  sessionHmacSecret: ""    # RUSH_SESSION_HMAC_SECRET — one-way browser-session token key
  ssoTransactionSecret: "" # RUSH_SSO_TRANSACTION_SECRET — signed OIDC/SAML transaction key; MUST stay stable
  configEncryptionKey: ""  # RUSH_CONFIG_ENCRYPTION_KEY — encrypts SSO client secrets; MUST stay stable
  audit:
    # Change keyId whenever auditHmacSecret is deliberately rotated. Supply old
    # keys as a JSON object (for example {"primary":"old-secret"}) so historical
    # segments remain verifiable. Prefer existingSecret for production values.
    keyId: primary
    previousKeysJson: ""
    spool:
      maxBytes: 268435456
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: ""
        accessModes: ["ReadWriteOnce"]
        size: 1Gi
  # Use a pre-created Secret instead of the auto-generated one. When set, the
  # chart creates no bootstrap Secret and reads these keys from yours:
  #   initial-admin-password, api-key-hmac-secret, audit-hmac-secret, session-hmac-secret,
  #   sso-transaction-secret, config-encryption-key, and optionally
  #   audit-hmac-previous-keys
  existingSecret: ""
  # Authentication is fail-closed by default. The anonymous-default switch is
  # only for local development; enabling it leaves /readyz unhealthy in a
  # production environment.
  environment: production
  # Required when environment is production. Use the externally reachable
  # HTTPS origin without a trailing path, query, or fragment.
  baseUrl: ""
  # Forwarded client addresses are ignored unless the direct peer belongs to
  # one of these proxy networks. Use pod/ingress CIDRs, never 0.0.0.0/0.
  trustedProxyCidrs: []
  # One-time OIDC/SAML/setup claims. "auto" uses an in-process store for one
  # replica and ClickHouse KeeperMap for two or more replicas. HA therefore
  # requires clickhouse.keeper.enabled=true (or Keeper on external ClickHouse).
  ssoReplayStore: auto
  loginRateLimit:
    accountPerMinute: 10
    ipPerMinute: 50
  # Shared request/decompression/entity budgets for every telemetry protocol.
  # Invalid values fail query-api startup rather than silently disabling limits.
  ingestLimits:
    maxCompressedBytes: 8388608
    maxDecompressedBytes: 33554432
    maxEntities: 200000
    maxSeries: 20000
    maxSamples: 200000
    maxMetadata: 10000
    maxLabelsPerSeries: 128
    maxLabelNameBytes: 256
    maxLabelValueBytes: 4096
    decodeConcurrency: 4
  # Browser sessions use a renewable idle deadline plus a hard maximum age.
  # Renewal rotates the HttpOnly bearer and never extends absoluteTimeoutSeconds.
  session:
    idleTimeoutSeconds: 1800
    absoluteTimeoutSeconds: 86400
    renewalIntervalSeconds: 300
  allowAnonymousDefault: false
  env:
    CLICKHOUSE_DATABASE: observability
    RUST_LOG: rush_api=info,tower_http=info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  networkPolicy:
    # Allows HTTP from this release namespace and restricts egress to DNS plus
    # the ports used for Kubernetes/HTTPS, ClickHouse, SRE-agent, and SMTP.
    enabled: true
    # Broad Internet access is off by default. Enable only for OIDC/SAML
    # discovery, Kubernetes API access, webhooks, or other HTTPS integrations.
    allowExternalHttpsEgress: false
    allowExternalClickHouseEgress: false
    allowSmtpEgress: false
    extraIngress: []
    extraEgress: []

# ══ Enterprise (commercial, license-gated) ══════════════════════════════
# Commercial license configuration used by Query API. Add-on workloads are
# installed by the rush-observability-stack chart.
enterprise:

  # ── Commercial license ──
  # When enabled, query-api reads RUSH_LICENSE_KEY from the named Secret and
  # verifies it offline. Create the secret with your minted license token:
  #   kubectl create secret generic rush-license --from-literal=license-key='<token>'
  license:
    enabled: false
    secret:
      name: rush-license
      key: license-key



# ── anomaly engine ──
# The anomaly engine evaluates rules and sends notifications. By default the
# query-api runs it in-process (fine for a single query-api replica). If you
# scale queryApi.replicas > 1, enable this dedicated single-replica Deployment —
# the chart then sets RUSH_RUN_ANOMALY_ENGINE=false on the API pods so rules are
# evaluated exactly once (no duplicate alerts).
anomalyEngine:
  enabled: false                     # set true when running multiple query-api pods
  inheritGlobalScheduling: true
  scheduling: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  priorityClassName: ""
  runtimeClassName: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  # Recreate prevents duplicate rule evaluation and notification delivery.
  rollout:
    strategy: Recreate
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    revisionHistoryLimit: 10
  podDisruptionBudget:
    enabled: false
    type: maxUnavailable
    value: 1
  networkPolicy:
    enabled: true
    allowExternalHttpsEgress: false
    allowSmtpEgress: false
    extraIngress: []
    extraEgress: []
  # Inherits queryApi.image by default because both workloads run the same Rush
  # API binary. Set only the fields that need to differ for an independent image.
  image: {}
  env:
    CLICKHOUSE_DATABASE: observability
    RUST_LOG: rush_api=info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ── internal stats engine ──
# Cadence (seconds) for the rush_stats_* gauges the API emits about itself. 15s keeps
# rate()/short windows usable; raise it to cut the (tiny) sample volume.
statsEngine:
  intervalSecs: 15

# ── PromQL query behavior ──
# Staleness/lookback (seconds): how long a metric's last value is carried forward in
# range queries. Default 300 (Prometheus 5m). Lower it so a stopped series' flat tail
# ends sooner; keep it >= your slowest scrape interval or live series will show gaps.
promql:
  lookbackSecs: 300

# ── argocd integration ──
# Infrastructure pages require a group permission of `infrastructure:read` and
# an operator-owned tenant-to-namespace grant. Group tenant bindings choose the
# active Rush tenant; this map limits the Kubernetes namespaces that tenant can
# inspect. `*` may be used as a shared tenant key. A namespace value of `*`
# requires kubernetes.clusterWide=true and is the explicit cluster-wide opt-in.
infrastructure:
  tenantNamespaces: {}

argocd:
  enabled: false                     # enable ArgoCD CRD reading
  namespace: argocd                  # namespace where ArgoCD apps live

# ── fluxcd integration (Flux v2 / GitOps Toolkit) ──
# Free integration: reads Kustomizations, HelmReleases, and Sources in one namespace.
fluxcd:
  enabled: false                     # enable Flux v2 CRD reading
  namespace: flux-system             # namespace containing Flux resources

# ── kubernetes integration (read-only cluster browser) ──
# Namespace-scoped by default. When enabled, list every namespace that the
# service account may read. tenantNamespaces must grant each tenant a subset.
kubernetes:
  enabled: false                     # enable the read-only Kubernetes resource browser
  namespaces: []
  clusterWide: false                 # explicit opt-in; still never grants Secrets

# ── cloudwatch integration (AWS CloudWatch Logs ingest via Kinesis Firehose) ──
# Free integration: ingests CloudWatch Logs pushed through a Kinesis Data Firehose
# HTTP endpoint. Tenant routing via access-key header or tenant URL path.
cloudwatch:
  enabled: false                     # enable CloudWatch Logs ingest endpoints

# ── frontend ──
frontend:
  inheritGlobalScheduling: true
  scheduling: {}
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  priorityClassName: ""
  runtimeClassName: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  image:
    repository: mzupan/rush-frontend
    tag: "0.1.12"
    digest: ""
    pullPolicy: Always
  # Public base URL (scheme + host, no trailing slash) of the Rush API as seen from
  # outside the cluster. Surfaced to the UI wherever it shows or reaches the API by
  # its public address — e.g. the CloudWatch ingest endpoint AWS Firehose must POST
  # to. Set this when the public API host differs from where admins load the UI
  # (e.g. internal UI + public ingest endpoint). Empty → the UI uses its own origin.
  apiBaseUrl: ""
  # The Rush frontend image runs nginx as uid 65532 and cannot bind below 1024.
  # The Service targetPort follows this via the named "http" port.
  containerPort: 8080
  replicas: 1
  rollout:
    strategy: RollingUpdate
    maxUnavailable: 0
    maxSurge: 1
    minReadySeconds: 0
    progressDeadlineSeconds: 600
    revisionHistoryLimit: 10
  podDisruptionBudget:
    enabled: false
    type: maxUnavailable
    value: 1
  probes:
    startup:
      enabled: true
      path: /
      initialDelaySeconds: 0
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
      successThreshold: 1
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 80
  networkPolicy:
    enabled: true
    # Allows same-namespace ingress controllers and port-forward helpers.
    allowSameNamespaceIngress: true
    extraIngress: []
    extraEgress: []

# Optional public entry points. The frontend host also proxies /api, /auth,
# /prom, and /metrics. Enable the API host only when a separate direct API
# origin is required. ingress.trustedProxyCidrs are added to query-api's trust
# list so forwarded client addresses are accepted only from known proxies.
ingress:
  enabled: false
  className: ""
  annotations: {}
  trustedProxyCidrs: []
  frontend:
    enabled: true
    host: ""
    path: /
    pathType: Prefix
    tls:
      enabled: true
      secretName: ""
  api:
    enabled: false
    host: ""
    path: /
    pathType: Prefix
    annotations: {}
    tls:
      enabled: true
      secretName: ""

# ── Storage / S3 tiering — SINGLE source of truth ──
# Lives under `global` so ONE block drives both the query-api rush.toml AND the
# ClickHouse subchart's storage config. (Helm only shares values with subcharts
# via `global`; the clickhouse dependency cannot see `rushConfig`.) Enable S3
# tiering with just this block — the chart auto-generates the ClickHouse S3 disk
# + cold volume (see clickhouse.clickhouse.extraConfig). No hand-written XML.
global:
  rush:
    # Component labels allowed to send telemetry to Query API. The umbrella
    # chart fills this with its enabled add-on component identities.
    queryApiIngressComponents: []
    # The stack chart fills this in so Query API can register the same ingest
    # credential mounted by its collectors. Core-only installs leave it off.
    ingestApiKeySecret:
      autoGenerate: false
      name: ""
      key: api-key
      value: ""

  # Optional connection to an SRE agent installed separately or by the
  # rush-observability-stack chart. This core chart does not deploy the agent.
  sreAgent:
    enabled: false
    port: 8081
    internalAuthToken: ""
    service:
      port: 8081
    githubApp:
      enabled: false
      tenantRepositories: {}

  # Shared scheduling defaults for core Rush workloads: Query API, frontend,
  # and anomaly engine. ClickHouse is intentionally independent; use
  # clickhouse.clickhouse/keeper scheduling (or clickhouseStandalone scheduling)
  # for storage-optimized node groups.
  # Component scheduling maps deep-merge over these defaults. Component lists
  # replace these lists. Set a component's inheritGlobalScheduling=false to opt out.
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  # Shared pod defaults. Non-empty component values replace shared lists and
  # scalar values; annotations and labels merge with component values winning.
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  priorityClassName: ""
  runtimeClassName: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  storage:
    s3:
      enabled: false            # set true + fill in to enable S3 tiered storage
      endpoint: ""              # blank = AWS S3 native; set for MinIO/RustFS/etc.
      bucket: "rush-clickhouse"
      access_key_id: ""         # leave blank for keyless (IRSA / EKS Pod Identity)
      secret_access_key: ""
      region: "us-east-1"
    tiering:
      metrics_move_after_days: 3   # 0 = disabled, keep on local disk only
      traces_move_after_days: 3
      logs_move_after_days: 7

# ── rush.toml config ──
# Rendered into a ConfigMap and mounted into query-api at /etc/rush/rush.toml
rushConfig:
  retention:
    defaults:
      metrics_days: 30
      traces_days: 30
      logs_days: 30
    metrics: []
    # - labels: { env: "dev" }
    #   retain_days: 90
    # - labels: { env: "prod" }
    #   retain_days: 400
    traces: []
    # - service_name: "gateway"
    #   retain_days: 60
    enforcer:
      enabled: true
      interval_secs: 3600
      dry_run: false

# ── ClickHouse (Altinity subchart) ──
# Full options: https://github.com/Altinity/helm-charts/tree/main/charts/clickhouse
clickhouse:
  # `enabled` controls the bundled Altinity chart dependency. Keep it true for
  # operator mode. Set it false for standalone or external mode so the
  # operator-managed ClickHouseInstallation is not rendered as well.
  enabled: true
  # Deployment strategy: operator (default), standalone (one StatefulSet), or
  # external (use an existing ClickHouse endpoint and Secret).
  mode: operator
  external:
    url: ""                         # e.g. https://clickhouse.example:8443
    credentialsSecret: ""           # migration/write identity
    userKey: user
    passwordKey: password
    # Distinct SELECT-only identity. The external ClickHouse administrator must
    # grant it SELECT only on telemetry tables and let query-api own strict row policies.
    readCredentialsSecret: ""
    readUserKey: user
    readPasswordKey: password
  clickhouse:
    defaultUser:
      password_secret_name: "rushobs-clickhouse-credentials"
      allowExternalAccess: true   # allow connections from other pods
    # Tenant-scoped application read identity. Never grant this user access to
    # config_* or audit_events; strict row policies are installed by query-api.
    users:
      - name: rushquery
        hostIP: "0.0.0.0/0"
        password_secret_name: "rushobs-clickhouse-read-credentials"
        grants:
          - "GRANT SELECT ON observability.logs"
          - "GRANT SELECT ON observability.spans"
          - "GRANT SELECT ON observability.spans_by_trace"
          - "GRANT SELECT ON observability.services"
          - "GRANT SELECT ON observability.metrics_gauge"
          - "GRANT SELECT ON observability.metrics_sum"
          - "GRANT SELECT ON observability.metrics_histogram"
          - "GRANT SELECT ON observability.metrics_exp_histogram"
          - "GRANT SELECT ON observability.metrics_summary"
          - "GRANT SELECT ON observability.metrics_gauge_1m"
          - "GRANT SELECT ON observability.metrics_gauge_1h"
          - "GRANT SELECT ON observability.metrics_sum_1m"
          - "GRANT SELECT ON observability.metrics_sum_1h"
          - "GRANT SELECT ON observability.rum"
          - "GRANT SELECT ON observability.rum_replay"
          - "GRANT SELECT ON observability.signal_usage"
          - "GRANT SELECT ON observability.tenant_usage"
    # Custom ClickHouse server configuration files.
    # rush_settings.xml: enables the 'rush_' custom settings prefix so that
    # rush-api can set `rush_tenant_id` per-query for row-level security
    # policies. Without this, getSetting('rush_tenant_id') in row policies
    # will fail with an unknown setting error.
    # Standalone also mounts this explicit file. Operator mode receives the same
    # setting through rush.clickhouseExtraConfig below.
    configurationFiles:
      rush_settings.xml: |
        <clickhouse>
          <custom_settings_prefixes>rush_</custom_settings_prefixes>
        </clickhouse>
    # ClickHouse server image. The 26.6 line adds the direct-read and dictionary-assisted
    # LIKE capabilities used by log search. The Altinity operator runs upstream server
    # images fine. Pin a patch for reproducibility.
    image:
      repository: clickhouse/clickhouse-server
      tag: "26.6.1.1193"
      pullPolicy: IfNotPresent
    # Bound ClickHouse memory. With NO limit the server sizes max_server_memory_usage to
    # ~90% of the whole node and the cgroup working-set grows unbounded. A hard limit caps
    # it and makes CH self-throttle instead of being OOM-killed. 8Gi is a conservative
    # baseline — SCALE WITH YOUR NODE and scale the cache sizes + memory profile below
    # proportionally. No CPU limit on purpose (merges/queries benefit from CPU burst).
    resources:
      requests:
        cpu: "500m"
        memory: "8Gi"
      limits:
        memory: "8Gi"
    # Scheduling for ClickHouse server pods is independent from
    # global.scheduling, allowing a dedicated storage node group.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    # Cache sizes in bytes — right-size with the memory limit above. Referenced by
    # the auto-generated extraConfig below (defaults suit the 8Gi baseline).
    markCacheSize: 2147483648          # 2 GiB
    uncompressedCacheSize: 134217728   # 128 MiB
    s3CacheSize: 21474836480           # 20 GiB local cache for S3-tiered reads
    # Text-index caches (26.6+): tokens/header/postings deserialized from the logs
    # `text` search index. Queries opt in via the default profile (extraUsers below);
    # sized down from ClickHouse's 1+1+2 GiB defaults to fit the 8Gi baseline.
    textIndexTokensCacheSize: 268435456    # 256 MiB
    textIndexHeaderCacheSize: 536870912    # 512 MiB
    textIndexPostingsCacheSize: 1073741824 # 1 GiB
    # Server log level (→ config.d/extra_config.xml <logger><level>). The operator
    # defaults to `debug`, which logs every executed query (full SQL, incl. user
    # search terms) — and Vector tails that back into the logs store. `information`
    # keeps warnings/errors without the per-query spam. Set `debug`/`trace` to
    # troubleshoot. Valid: none|fatal|error|warning|information|debug|trace.
    logLevel: information
    # Server config (→ config.d/extra_config.xml) is AUTO-GENERATED from
    # global.storage.s3 by the rush.clickhouseExtraConfig template:
    #   • always emits the `tiered` storage policy (REQUIRED — migrations create
    #     tables with storage_policy='tiered'; without it CREATE TABLE fails);
    #   • when global.storage.s3.enabled, also adds the S3 disk + cache + cold
    #     volume (keyless if no access keys are set).
    # Enable tiering with ONLY the global.storage.s3 block — no hand-written XML.
    # Override this string only for advanced ClickHouse storage customization.
    extraConfig: |
      {{- include "rush.clickhouseExtraConfig" . }}
    # Per-query / per-user memory ceilings (default profile). Caps one query below the
    # server budget so it fails gracefully (MEMORY_LIMIT_EXCEEDED) instead of OOM-killing
    # the pod; GROUP BY/ORDER BY still spill to disk first. Scale with the memory limit.
    extraUsers: |
      <clickhouse>
        <profiles>
          <default>
            <max_memory_usage>5368709120</max_memory_usage>
            <max_memory_usage_for_user>6442450944</max_memory_usage_for_user>
            <!-- Use the GLOBAL text-index caches (tokens/header/postings/dictionary).
                 These query settings default to 0 in 26.6, which silently gives every
                 query a throwaway per-query cache: misses are counted, nothing is ever
                 retained, and repeated log searches re-read the text index from disk
                 (measured: 0 cache hits ever; enabling these turned identical repeat
                 searches from cold-disk index analysis into cache hits). The global
                 caches are bounded by the text_index_*_cache_size server settings
                 (1+1+2 GiB defaults), SLRU-evicted, and shrink under memory pressure. -->
            <use_text_index_tokens_cache>1</use_text_index_tokens_cache>
            <use_text_index_header_cache>1</use_text_index_header_cache>
            <use_text_index_postings_cache>1</use_text_index_postings_cache>
            <use_text_index_dictionary_cache>1</use_text_index_dictionary_cache>
          </default>
        </profiles>
      </clickhouse>
  shardsCount: 1
  replicasCount: 1
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.6.1.1193"
    digest: ""
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ""      # empty = cluster default
    size: 500Gi
  service:
    type: ClusterIP
  keeper:
    enabled: false
    # Keeper supports an independent node selector and tolerations. zoneSpread
    # adds its built-in zone topology constraint.
    nodeSelector: {}
    tolerations: []
  operator:
    # Set to false if the Altinity ClickHouse Operator is already installed
    # cluster-wide (e.g. shared by multiple teams or managed separately).
    # Rush will still deploy the ClickHouseInstallation CRD resource; it just
    # won't install the operator Deployment, RBAC, or CRDs again.
    enabled: true
    # Dependency-owned control-plane workload. Configure explicitly when node
    # groups are tainted; it does not inherit global.scheduling.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    # Override the upstream chart's floating kubectl:latest CRD hook.
    crdHook:
      nodeSelector: {}
      tolerations: []
      affinity: {}
      image:
        repository: bitnami/kubectl
        tag: "1.33.4"
        pullPolicy: IfNotPresent
    # Name applied to the operator's resources (Deployment/pod, RBAC, Secret,
    # ServiceMonitor, dashboards). Without this, the Altinity subchart names them
    # "<release>-operator" (e.g. rushobs-operator). Pin it to "clickhouse-operator"
    # so the operator is recognizable regardless of release name. Set to "" to
    # restore the release-prefixed default.
    fullnameOverride: clickhouse-operator

# Standalone mode settings. This intentionally supports one ClickHouse pod;
# replicated ClickHouse still needs Keeper and is better handled by the
# operator mode.
clickhouseStandalone:
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  priorityClassName: ""
  runtimeClassName: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  rollout:
    strategy: RollingUpdate
    partition: 0
    podManagementPolicy: OrderedReady
    revisionHistoryLimit: 10
  podDisruptionBudget:
    enabled: false
    type: maxUnavailable
    value: 1
  networkPolicy:
    enabled: true
    allowExternalHttpsEgress: false
    extraIngress: []
    extraEgress: []
  persistence:
    enabled: true
    storageClass: ""
    size: 500Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 120
  probes:
    startup:
      enabled: true
      path: /ping
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1
    readiness:
      enabled: true
      path: /ping
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    liveness:
      enabled: true
      path: /ping
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
  # Standalone ClickHouse never inherits global.scheduling.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []


# Native `helm test` connectivity checks. Jobs are created only as Helm test
# hooks and use the query-api image, which already contains curl.
helmTests:
  enabled: true
  clickhouseConnectivity: true
  activeDeadlineSeconds: 180
  backoffLimit: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
