{{- if .Values.kubernetes.enabled }}
{{- if and (not .Values.kubernetes.clusterWide) (empty .Values.kubernetes.namespaces) }}
{{- fail "kubernetes.namespaces must contain at least one namespace when kubernetes.enabled=true and kubernetes.clusterWide=false" }}
{{- end }}
{{- if .Values.kubernetes.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rush.fullname" . }}-kubernetes-reader
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
rules:
  # Secret resources are intentionally absent. Keep this list aligned with
  # query-api/src/handlers/kubernetes.rs.
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "namespaces", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rush.fullname" . }}-kubernetes-reader
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rush.fullname" . }}-kubernetes-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.queryApi "component" "query-api") }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $namespace := .Values.kubernetes.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rush.fullname" $ }}-kubernetes-reader
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rush.fullname" $ }}-kubernetes-reader
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rush.fullname" $ }}-kubernetes-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.serviceAccountName" (dict "root" $ "workload" $.Values.queryApi "component" "query-api") }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
