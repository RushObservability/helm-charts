{{- /*
  Bootstrap secret for query-api: the initial admin password, audit-log HMAC
  key, session-token HMAC key, SSO transaction HMAC key, config-encryption key,
  and SRE-agent internal authentication token. For each value the
  resolution order is:
    1. an explicit preset in values
    2. the value already stored in this Secret — preserved across `helm upgrade`
       via `lookup` so it does NOT regenerate (critical for the audit HMAC key,
       which must stay stable or the audit hash-chain breaks)
    3. a freshly generated random value (first install only)

  If queryApi.existingSecret is set, this template renders nothing — the
  deployment reads the values from that Secret instead (expected keys:
  initial-admin-password, audit-hmac-secret, session-hmac-secret,
  sso-transaction-secret, config-encryption-key, audit-hmac-previous-keys,
  sre-agent-internal-token).

  NOTE: `lookup` returns empty during `helm template`/`--dry-run` (no cluster
  access), so those render a throwaway random value each time. Real install/
  upgrade against a cluster preserve the stored value as described above.
*/ -}}
{{- if not .Values.queryApi.existingSecret }}
{{- $name := printf "%s-bootstrap" (include "rush.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $curPw := "" }}
{{- $curHmac := "" }}
{{- $curSessionHmac := "" }}
{{- $curAuditPrevious := "" }}
{{- $curSsoTransaction := "" }}
{{- $curConfigEncryption := "" }}
{{- $curAgentToken := "" }}
{{- if $existing }}
{{-   $curPw = (index $existing.data "initial-admin-password" | default "" | b64dec) }}
{{-   $curHmac = (index $existing.data "audit-hmac-secret" | default "" | b64dec) }}
{{-   $curSessionHmac = (index $existing.data "session-hmac-secret" | default "" | b64dec) }}
{{-   $curAuditPrevious = (index $existing.data "audit-hmac-previous-keys" | default "" | b64dec) }}
{{-   $curSsoTransaction = (index $existing.data "sso-transaction-secret" | default "" | b64dec) }}
{{-   $curConfigEncryption = (index $existing.data "config-encryption-key" | default "" | b64dec) }}
{{-   $curAgentToken = (index $existing.data "sre-agent-internal-token" | default "" | b64dec) }}
{{- end }}
{{- $pw := .Values.queryApi.adminPassword | default $curPw | default (randAlphaNum 24) }}
{{- $hmac := .Values.queryApi.auditHmacSecret | default $curHmac | default (randAlphaNum 64) }}
{{- $sessionHmac := .Values.queryApi.sessionHmacSecret | default $curSessionHmac | default (randAlphaNum 64) }}
{{- $ssoTransaction := .Values.queryApi.ssoTransactionSecret | default $curSsoTransaction | default (randAlphaNum 64) }}
{{- $configEncryption := .Values.queryApi.configEncryptionKey | default $curConfigEncryption | default (randAlphaNum 64) }}
{{- $agentToken := .Values.global.sreAgent.internalAuthToken | default $curAgentToken | default (randAlphaNum 64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` so the audit/config keys (and admin password)
    # aren't lost — regeneration would break the audit chain and make stored
    # SSO client secrets unreadable.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  initial-admin-password: {{ $pw | b64enc | quote }}
  audit-hmac-secret: {{ $hmac | b64enc | quote }}
  session-hmac-secret: {{ $sessionHmac | b64enc | quote }}
  audit-hmac-previous-keys: {{ .Values.queryApi.audit.previousKeysJson | default $curAuditPrevious | default "" | b64enc | quote }}
  sso-transaction-secret: {{ $ssoTransaction | b64enc | quote }}
  config-encryption-key: {{ $configEncryption | b64enc | quote }}
  sre-agent-internal-token: {{ $agentToken | b64enc | quote }}
{{- end }}
