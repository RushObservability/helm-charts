{{- if and .Values.workerMetrics.enabled .Values.workerMetrics.scraperComponents }}
{{- $workers := list (dict "component" "query-api-drain-worker" "enabled" (and .Values.queryApi.drainWorker.enabled .Values.queryApi.networkPolicy.enabled)) (dict "component" "anomaly-engine" "enabled" (and .Values.anomalyEngine.enabled .Values.anomalyEngine.networkPolicy.enabled)) }}
{{- range $workers }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-metrics" (include "rush.componentName" (dict "root" $ "component" .component)) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "rush.componentLabels" (dict "root" $ "component" .component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" $ "component" .component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $.Values.workerMetrics.scraperComponents }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ . | quote }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
      ports:
        - protocol: TCP
          port: metrics
{{- end }}
{{- end }}
{{- end }}
