{{- if eq .Values.clickhouse.mode "standalone" -}}
{{- if .Values.clickhouse.enabled -}}
{{- fail "clickhouse.enabled must be false when clickhouse.mode=standalone; this prevents the Altinity operator subchart from rendering" -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rush.clickhouseService" . }}
  labels:
    app.kubernetes.io/component: clickhouse
    {{- include "rush.labels" . | nindent 4 }}
spec:
  type: {{ .Values.clickhouse.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: tcp
      port: 9000
      targetPort: tcp
  selector:
    app.kubernetes.io/component: clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rush.clickhouseService" . }}
  labels:
    app.kubernetes.io/component: clickhouse
    {{- include "rush.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rush.clickhouseService" . }}
  replicas: 1
  podManagementPolicy: {{ .Values.clickhouseStandalone.rollout.podManagementPolicy }}
  revisionHistoryLimit: {{ .Values.clickhouseStandalone.rollout.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/component: clickhouse
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: {{ .Values.clickhouseStandalone.rollout.strategy }}
    {{- if eq .Values.clickhouseStandalone.rollout.strategy "RollingUpdate" }}
    rollingUpdate:
      partition: {{ .Values.clickhouseStandalone.rollout.partition }}
    {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: clickhouse
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.clickhouseStandalone)) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/clickhouse-standalone-configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ include (print $.Template.BasePath "/clickhouse-credentials.yaml") . | sha256sum }}
        {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.clickhouseStandalone)) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.clickhouseStandalone) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.clickhouseStandalone "component" "clickhouse") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.clickhouseStandalone.terminationGracePeriodSeconds }}
      {{- with .Values.clickhouseStandalone.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouseStandalone.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouseStandalone.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouseStandalone.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.clickhouseStandalone.podSecurityContext | nindent 8 }}
      containers:
        - name: clickhouse
          image: {{ include "rush.image" (dict "image" .Values.clickhouse.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: tcp
              containerPort: 9000
              protocol: TCP
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.queryApi.env.CLICKHOUSE_DATABASE | default "observability" | quote }}
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rushobs-clickhouse-credentials
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: RUSH_CLICKHOUSE_READ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rushobs-clickhouse-read-credentials
                  key: password
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.clickhouseStandalone) | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: config
              mountPath: /etc/clickhouse-server/config.d/extra_config.xml
              subPath: extra_config.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/extra_users.xml
              subPath: extra_users.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/default_user.xml
              subPath: default_user.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/read_user.xml
              subPath: read_user.xml
              readOnly: true
            {{- range $name, $_ := .Values.clickhouse.clickhouse.configurationFiles }}
            - name: config
              mountPath: /etc/clickhouse-server/config.d/{{ $name }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $.Values.clickhouseStandalone)) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if .Values.clickhouseStandalone.probes.startup.enabled }}
          startupProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.clickhouseStandalone.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.clickhouseStandalone.probes.readiness.enabled }}
          readinessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.clickhouseStandalone.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.clickhouseStandalone.probes.liveness.enabled }}
          livenessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.clickhouseStandalone.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rush.fullname" . }}-clickhouse-standalone
        - name: init
          configMap:
            name: {{ include "rush.fullname" . }}-clickhouse-standalone-init
        - name: logs
          emptyDir: {}
        {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $.Values.clickhouseStandalone)) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if not .Values.clickhouseStandalone.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.clickhouseStandalone.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.clickhouseStandalone.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouseStandalone.persistence.size }}
  {{- end }}
{{- end }}
