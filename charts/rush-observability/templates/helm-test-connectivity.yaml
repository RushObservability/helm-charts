{{- /* Kept outside templates/tests so chart .helmignore excludes only repository tests. */ -}}
{{- if .Values.helmTests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "connectivity-test") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "helm-test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.helmTests.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.helmTests.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "helm-test") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connectivity
          # The query-api image is distroless (no shell or curl), so the test runs in
          # the chart's pinned busybox helper image and uses busybox wget.
          image: {{ include "rush.image" (dict "root" . "image" .Values.queryApi.spoolInit.image "defaultTag" .Values.queryApi.spoolInit.image.tag) | quote }}
          imagePullPolicy: {{ .Values.queryApi.spoolInit.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              wget -q -T 10 -O /dev/null "${QUERY_API_URL}/healthz"
              wget -q -T 10 -O /dev/null "${QUERY_API_URL}/readyz"
              wget -q -T 10 -O /dev/null "${FRONTEND_URL}/"
              wget -q -T 10 -O /dev/null "${FRONTEND_URL}/metrics"
              {{- if .Values.helmTests.clickhouseConnectivity }}
              wget -q -T 10 -O - \
                --header "X-ClickHouse-User: ${CLICKHOUSE_USER}" \
                --header "X-ClickHouse-Key: ${CLICKHOUSE_PASSWORD}" \
                "${CLICKHOUSE_URL}/ping" | grep -q '^Ok'
              {{- end }}
          env:
            - name: QUERY_API_URL
              value: {{ include "rush.queryApiUrl" . | quote }}
            - name: FRONTEND_URL
              value: {{ printf "http://%s:%v" (include "rush.componentName" (dict "root" . "component" "frontend")) .Values.frontend.service.port | quote }}
            {{- if .Values.helmTests.clickhouseConnectivity }}
            - name: CLICKHOUSE_URL
              value: {{ include "rush.clickhouseUrl" . | quote }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rush.clickhouseCredentialsSecret" . }}
                  key: {{ include "rush.clickhouseUserKey" . }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rush.clickhouseCredentialsSecret" . }}
                  key: {{ include "rush.clickhousePasswordKey" . }}
            {{- end }}
          resources:
            {{- toYaml .Values.helmTests.resources | nindent 12 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
            # busybox defaults to root; run as the same unprivileged user as the spool init.
            runAsUser: 999
            runAsGroup: 999
{{- end }}
