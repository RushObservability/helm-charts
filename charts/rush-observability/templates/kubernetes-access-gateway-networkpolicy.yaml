{{- if and .Values.enterprise.kubernetesAccessGateway.enabled .Values.enterprise.kubernetesAccessGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.enterprise.kubernetesAccessGateway.networkPolicy.allowSameNamespaceIngress }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: https
    {{- end }}
    {{- if .Values.enterprise.kubernetesAccessGateway.networkPolicy.allowExternalIngress }}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: https
    {{- end }}
    {{- with .Values.enterprise.kubernetesAccessGateway.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    # The Kubernetes API may be a virtual IP or an external managed endpoint,
    # so it cannot be selected reliably by pod labels.
    - to:
        {{- range .Values.enterprise.kubernetesAccessGateway.upstream.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- with .Values.enterprise.kubernetesAccessGateway.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
