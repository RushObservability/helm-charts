{{- if and (eq .Values.queryApi.workloadKind "Deployment") .Values.queryApi.auditSpoolPersistence.enabled (not .Values.queryApi.auditSpoolPersistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rush.fullname" . }}-query-api-audit
  labels:
    app.kubernetes.io/component: query-api
    {{- include "rush.labels" . | nindent 4 }}
  annotations:
    # The outbox can contain audit events not yet committed to ClickHouse. Keep
    # it through a chart uninstall/reinstall unless an operator deletes it.
    "helm.sh/resource-policy": keep
spec:
  {{- include "rush.spoolClaimSpec" .Values.queryApi.auditSpoolPersistence | nindent 2 }}
{{- end }}
