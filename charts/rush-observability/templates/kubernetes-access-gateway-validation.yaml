{{- if or .Values.enterprise.kubernetesAccess.enabled .Values.enterprise.kubernetesAccessGateway.enabled }}
{{- if not .Values.enterprise.license.enabled }}
{{- fail "Kubernetes access recording requires enterprise.license.enabled=true" }}
{{- end }}
{{- end }}
{{- if .Values.enterprise.kubernetesAccessGateway.enabled }}
{{- if not .Values.enterprise.kubernetesAccessGateway.gatewayId }}
{{- fail "enterprise.kubernetesAccessGateway.gatewayId is required when Kubernetes access recording is enabled" }}
{{- end }}
{{- if not .Values.enterprise.kubernetesAccessGateway.clusterId }}
{{- fail "enterprise.kubernetesAccessGateway.clusterId is required when Kubernetes access recording is enabled" }}
{{- end }}
{{- if empty .Values.enterprise.kubernetesAccessGateway.tenantIds }}
{{- fail "enterprise.kubernetesAccessGateway.tenantIds must list at least one tenant when Kubernetes access recording is enabled" }}
{{- end }}
{{- if and (not .Values.enterprise.kubernetesAccessGateway.rbac.createImpersonationRole) (not .Values.enterprise.kubernetesAccessGateway.rbac.manageRoles) (not .Values.enterprise.kubernetesAccessGateway.serviceAccount.name) }}
{{- fail "set enterprise.kubernetesAccessGateway.serviceAccount.name or explicitly enable rbac.createImpersonationRole or rbac.manageRoles" }}
{{- end }}
{{- end }}
