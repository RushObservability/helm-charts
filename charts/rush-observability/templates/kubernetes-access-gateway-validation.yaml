{{- if or .Values.queryApi.kubernetesAccess.enabled .Values.kubernetesAccessGateway.enabled }}
{{- if not .Values.enterprise.license.enabled }}
{{- fail "Kubernetes access recording requires enterprise.license.enabled=true" }}
{{- end }}
{{- end }}
{{- if .Values.kubernetesAccessGateway.enabled }}
{{- if not .Values.kubernetesAccessGateway.gatewayId }}
{{- fail "kubernetesAccessGateway.gatewayId is required when Kubernetes access recording is enabled" }}
{{- end }}
{{- if not .Values.kubernetesAccessGateway.clusterId }}
{{- fail "kubernetesAccessGateway.clusterId is required when Kubernetes access recording is enabled" }}
{{- end }}
{{- if empty .Values.kubernetesAccessGateway.tenantIds }}
{{- fail "kubernetesAccessGateway.tenantIds must list at least one tenant when Kubernetes access recording is enabled" }}
{{- end }}
{{- if and (not .Values.kubernetesAccessGateway.rbac.createImpersonationRole) (not .Values.kubernetesAccessGateway.rbac.manageRoles) (not .Values.kubernetesAccessGateway.serviceAccount.name) }}
{{- fail "set kubernetesAccessGateway.serviceAccount.name or explicitly enable rbac.createImpersonationRole or rbac.manageRoles" }}
{{- end }}
{{- end }}
