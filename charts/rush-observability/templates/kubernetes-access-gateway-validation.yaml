{{- if .Values.enterprise.kubernetesAccess.enabled }}
{{- if not .Values.enterprise.license.enabled }}
{{- fail "Kubernetes access recording requires enterprise.license.enabled=true" }}
{{- end }}
{{- if not .Values.enterprise.kubernetesAccess.gatewayId }}
{{- fail "enterprise.kubernetesAccess.gatewayId is required when Kubernetes access recording is enabled" }}
{{- end }}
{{- if not .Values.enterprise.kubernetesAccess.clusterId }}
{{- fail "enterprise.kubernetesAccess.clusterId is required when Kubernetes access recording is enabled" }}
{{- end }}
{{- if empty .Values.enterprise.kubernetesAccess.tenantIds }}
{{- fail "enterprise.kubernetesAccess.tenantIds must list at least one tenant when Kubernetes access recording is enabled" }}
{{- end }}
{{- if and (not .Values.enterprise.kubernetesAccess.rbac.createImpersonationRole) (not .Values.enterprise.kubernetesAccess.rbac.manageRoles) (not .Values.enterprise.kubernetesAccess.serviceAccount.name) }}
{{- fail "set enterprise.kubernetesAccess.serviceAccount.name or explicitly enable rbac.createImpersonationRole or rbac.manageRoles" }}
{{- end }}
{{- end }}
