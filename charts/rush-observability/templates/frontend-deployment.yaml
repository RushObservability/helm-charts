apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  {{- include "rush.deploymentRollout" (dict "rollout" .Values.frontend.rollout) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.frontend)) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-configmap.yaml") . | sha256sum }}
        {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.frontend)) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" .Values.frontend) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.frontend) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.frontend "component" "frontend") }}
      # The frontend serves static files and proxies /api. It needs no Kubernetes
      # API token. The Rush Chainguard image runs as uid 65532 and binds 8080.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "rush.image" (dict "image" .Values.frontend.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort | default 8080 }}
          env:
            - name: QUERY_API_HOST
              value: "{{ include "rush.queryApiServiceName" . }}:{{ .Values.queryApi.service.port }}"
            # Public base URL (scheme+host, no trailing slash) of the Rush API as
            # seen from outside the cluster, surfaced to the UI (e.g. the CloudWatch
            # ingest endpoint AWS Firehose posts to). Empty → UI uses its origin.
            - name: API_PUBLIC_URL
              value: "{{ .Values.frontend.apiBaseUrl | default "" }}"
            - name: RUSH_ENVIRONMENT
              value: "{{ .Values.queryApi.environment }}"
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.frontend) | nindent 10 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: runtime-tmp
              mountPath: /tmp
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $.Values.frontend)) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if .Values.frontend.probes.startup.enabled }}
          startupProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.frontend.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.frontend.probes.readiness.enabled }}
          readinessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.frontend.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.frontend.probes.liveness.enabled }}
          livenessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.frontend.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "rush.componentName" (dict "root" . "component" "frontend-nginx") }}
        - name: runtime-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $.Values.frontend)) }}
        {{- . | nindent 8 }}
        {{- end }}
