{{- $integrations := .Values.queryApi.config.integrations -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.queryApiServiceName" . }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "query-api") | nindent 4 }}
spec:
  replicas: {{ .Values.queryApi.replicas }}
  {{- include "rush.deploymentRollout" (dict "rollout" .Values.queryApi.rollout) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.queryApi)) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/rush-config: {{ include (print $.Template.BasePath "/rush-config-configmap.yaml") . | sha256sum }}
        {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.queryApi)) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" .Values.queryApi) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.queryApi) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.queryApi "component" "query-api") }}
      terminationGracePeriodSeconds: {{ .Values.queryApi.terminationGracePeriodSeconds | default 120 }}
      automountServiceAccountToken: {{ or $integrations.kubernetes.enabled $integrations.argocd.enabled $integrations.fluxcd.enabled }}
      securityContext:
        runAsNonRoot: true
        # Matches the appgroup created by query-api/Dockerfile and grants it
        # write access only to the dedicated spool volume.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query-api
          image: {{ include "rush.image" (dict "image" .Values.queryApi.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.queryApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.queryApi.port }}
          env:
            {{- include "rush.clickhouseWriteEnv" . | nindent 12 }}
            {{- include "rush.clickhouseReadEnv" . | nindent 12 }}
            - name: RUSH_CONFIG
              value: /etc/rush/rush.toml
            - name: RUSH_ENVIRONMENT
              value: {{ .Values.queryApi.config.runtime.environment | quote }}
            - name: RUSH_BASE_URL
              value: {{ include "rush.effectiveBaseUrl" . | quote }}
            - name: RUSH_TRUSTED_PROXY_CIDRS
              value: {{ include "rush.trustedProxyCidrs" . | quote }}
            - name: RUSH_QUERY_API_REPLICAS
              value: {{ .Values.queryApi.replicas | quote }}
            - name: RUSH_SSO_REPLAY_STORE
              value: {{ .Values.queryApi.config.authentication.ssoReplayStore | quote }}
            - name: RUSH_LOGIN_ACCOUNT_LIMIT_PER_MINUTE
              value: {{ .Values.queryApi.config.authentication.loginRateLimit.accountPerMinute | quote }}
            - name: RUSH_LOGIN_IP_LIMIT_PER_MINUTE
              value: {{ .Values.queryApi.config.authentication.loginRateLimit.ipPerMinute | quote }}
            - name: RUSH_INGEST_MAX_COMPRESSED_BYTES
              value: {{ .Values.queryApi.config.ingest.limits.maxCompressedBytes | int64 | quote }}
            - name: RUSH_INGEST_MAX_DECOMPRESSED_BYTES
              value: {{ .Values.queryApi.config.ingest.limits.maxDecompressedBytes | int64 | quote }}
            - name: RUSH_INGEST_MAX_ENTITIES
              value: {{ .Values.queryApi.config.ingest.limits.maxEntities | quote }}
            - name: RUSH_INGEST_MAX_SERIES
              value: {{ .Values.queryApi.config.ingest.limits.maxSeries | quote }}
            - name: RUSH_INGEST_MAX_SAMPLES
              value: {{ .Values.queryApi.config.ingest.limits.maxSamples | quote }}
            - name: RUSH_INGEST_MAX_METADATA
              value: {{ .Values.queryApi.config.ingest.limits.maxMetadata | quote }}
            - name: RUSH_INGEST_MAX_LABELS_PER_SERIES
              value: {{ .Values.queryApi.config.ingest.limits.maxLabelsPerSeries | quote }}
            - name: RUSH_INGEST_MAX_LABEL_NAME_BYTES
              value: {{ .Values.queryApi.config.ingest.limits.maxLabelNameBytes | quote }}
            - name: RUSH_INGEST_MAX_LABEL_VALUE_BYTES
              value: {{ .Values.queryApi.config.ingest.limits.maxLabelValueBytes | quote }}
            - name: RUSH_INGEST_DECODE_CONCURRENCY
              value: {{ .Values.queryApi.config.ingest.limits.decodeConcurrency | quote }}
            - name: RUSH_SESSION_IDLE_TIMEOUT_SECS
              value: {{ .Values.queryApi.config.authentication.session.idleTimeoutSeconds | quote }}
            - name: RUSH_SESSION_ABSOLUTE_TIMEOUT_SECS
              value: {{ .Values.queryApi.config.authentication.session.absoluteTimeoutSeconds | quote }}
            - name: RUSH_SESSION_RENEWAL_INTERVAL_SECS
              value: {{ .Values.queryApi.config.authentication.session.renewalIntervalSeconds | quote }}
            - name: RUSH_ALLOW_ANONYMOUS_DEFAULT
              value: {{ .Values.queryApi.config.authentication.allowAnonymousDefault | quote }}
            - name: RUSH_SPOOL_DIR
              value: /var/lib/rush/spool
            {{- include "rush.queryApiBufferEnv" (dict "root" . "drainOnly" false) | nindent 12 }}
            - name: RUSH_AUDIT_SPOOL_DIR
              value: /var/lib/rush/audit-spool
            - name: RUSH_AUDIT_SPOOL_MAX_BYTES
              value: {{ .Values.queryApi.config.audit.spoolMaxBytes | int64 | quote }}
            - name: RUSH_AUDIT_HMAC_KEY_ID
              value: {{ .Values.queryApi.config.audit.keyId | quote }}
            # Run the anomaly engine in-process only when there is no dedicated
            # anomaly-engine Deployment, so rules aren't evaluated twice.
            - name: RUSH_RUN_ANOMALY_ENGINE
              value: {{ not .Values.anomalyEngine.enabled | quote }}
            # Emit cadence for internal rush_stats_* gauges (15s keeps rate() usable).
            - name: RUSH_STATS_INTERVAL_SECS
              value: {{ .Values.statsEngine.intervalSecs | default 15 | quote }}
            # PromQL staleness/lookback: how long a metric's last value carries forward.
            - name: RUSH_PROM_LOOKBACK_SECS
              value: {{ .Values.promql.lookbackSecs | default 300 | quote }}
            # Operator-owned group -> tenant -> Kubernetes namespace boundary.
            # Empty/missing tenant entries deny infrastructure reads.
            - name: RUSH_INFRASTRUCTURE_TENANT_NAMESPACES
              value: {{ $integrations.infrastructure.tenantNamespaces | toJson | quote }}
            {{- if $integrations.argocd.enabled }}
            - name: ARGOCD_NAMESPACE
              value: {{ $integrations.argocd.namespace | quote }}
            {{- end }}
            {{- if $integrations.fluxcd.enabled }}
            - name: FLUXCD_NAMESPACE
              value: {{ $integrations.fluxcd.namespace | quote }}
            {{- end }}
            {{- if $integrations.kubernetes.enabled }}
            - name: KUBERNETES_ENABLED
              value: "true"
            - name: KUBERNETES_CLUSTER_WIDE
              value: {{ $integrations.kubernetes.clusterWide | quote }}
            {{- end }}
            {{- if $integrations.cloudwatch.enabled }}
            - name: CLOUDWATCH_ENABLED
              value: "true"
            {{- end }}
            {{- if $integrations.sreAgent.enabled }}
            # query-api fronts the SRE agent: it authenticates + injects the
            # caller's tenant, then forwards /investigate, /sessions, and
            # /investigation-templates to the agent at this URL.
            - name: SRE_AGENT_URL
              value: {{ include "rush.sreAgentUrl" . | quote }}
            {{- if $integrations.sreAgent.githubApp.enabled }}
            # The API uses the same operator-owned policy as the agent so
            # browser callers can never choose installation/repository IDs.
            - name: SRE_AGENT_GITHUB_REPOSITORY_POLICY
              value: {{ $integrations.sreAgent.githubApp.tenantRepositories | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.enterprise.license.enabled }}
            # Commercial license (Ed25519-signed token), verified offline by the API.
            - name: RUSH_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.enterprise.license.secret.name }}
                  key: {{ .Values.enterprise.license.secret.key }}
            {{- end }}
            {{- $bootstrapSecret := .Values.queryApi.config.secrets.existingSecret | default (printf "%s-bootstrap" (include "rush.fullname" .)) }}
            # First-boot admin seed plus API-key/audit/session HMAC keys. Auto-generated and
            # preserved across upgrades by query-api-secret.yaml (or supply your
            # own via queryApi.config.secrets.existingSecret). Never hard-code
            # these in values.
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: initial-admin-password
            - name: RUSH_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: api-key-hmac-secret
                  # Older externally managed bootstrap Secrets may not have
                  # this key yet; keeping it optional avoids breaking upgrades.
                  optional: true
            - name: RUSH_AUDIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: audit-hmac-secret
            - name: RUSH_AUDIT_HMAC_PREVIOUS_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: audit-hmac-previous-keys
                  optional: true
            - name: RUSH_SESSION_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: session-hmac-secret
                  optional: true
            - name: RUSH_SSO_TRANSACTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: sso-transaction-secret
            - name: RUSH_CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: config-encryption-key
            {{- if or $integrations.kubernetesAccess.enabled .Values.kubernetesAccessGateway.enabled }}
            - name: KUBERNETES_ACCESS_ENABLED
              value: "true"
            - name: KUBERNETES_ACCESS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: kubernetes-access-internal-token
            - name: KUBERNETES_ACCESS_MAX_RESULT_BYTES
              value: {{ $integrations.kubernetesAccess.maxResultBytes | quote }}
            - name: KUBERNETES_ACCESS_MAX_SESSION_BYTES
              value: {{ $integrations.kubernetesAccess.maxSessionBytes | quote }}
            - name: KUBERNETES_ACCESS_RETENTION_DAYS
              value: {{ $integrations.kubernetesAccess.retentionDays | quote }}
            - name: KUBERNETES_ACCESS_RETAIN_RAW_IP
              value: {{ $integrations.kubernetesAccess.retainRawIp | quote }}
            - name: KUBERNETES_ACCESS_COLLECT_PRIVATE_IP
              value: {{ $integrations.kubernetesAccess.collectPrivateIp | quote }}
            - name: KUBERNETES_ACCESS_CREDENTIAL_TTL_SECONDS
              value: {{ $integrations.kubernetesAccess.credentialTtlSeconds | quote }}
            - name: KUBERNETES_ACCESS_GATEWAY_ID
              value: {{ .Values.kubernetesAccessGateway.gatewayId | quote }}
            - name: KUBERNETES_ACCESS_GATEWAY_TENANT_IDS
              value: {{ join "," .Values.kubernetesAccessGateway.tenantIds | quote }}
            - name: KUBERNETES_ACCESS_GATEWAY_CLUSTER_ID
              value: {{ .Values.kubernetesAccessGateway.clusterId | quote }}
            {{- $tenantClusters := dict }}
            {{- range .Values.kubernetesAccessGateway.tenantIds }}
            {{- $_ := set $tenantClusters . (list $.Values.kubernetesAccessGateway.clusterId) }}
            {{- end }}
            - name: KUBERNETES_ACCESS_TENANT_CLUSTERS
              value: {{ $tenantClusters | toJson | quote }}
            {{- end }}
            {{- $ingestSecret := include "rush.bootstrapIngestApiKeySecretName" . }}
            {{- if $ingestSecret }}
            # The plaintext is used only to idempotently register its HMAC in
            # Query API's config store. It is never written to logs or storage.
            - name: RUSH_BOOTSTRAP_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $ingestSecret }}
                  key: {{ .Values.global.rush.ingestApiKeySecret.key }}
            {{- end }}
            {{- if $integrations.sreAgent.enabled }}
            - name: SRE_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: sre-agent-internal-token
            {{- end }}
            {{- range $key, $val := .Values.queryApi.config.runtime.extraEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.queryApi) | nindent 10 }}
          volumeMounts:
            - name: rush-config
              mountPath: /etc/rush
              readOnly: true
            - name: rush-spool
              mountPath: /var/lib/rush/spool
            - name: audit-spool
              mountPath: /var/lib/rush/audit-spool
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $.Values.queryApi)) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.queryApi.resources | nindent 12 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
          {{- if .Values.queryApi.gracefulShutdown.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    exec /usr/bin/curl --fail --silent --show-error --max-time 5
                    --request POST http://127.0.0.1:{{ .Values.queryApi.port }}/shutdown
          {{- end }}
          {{- if .Values.queryApi.probes.startup.enabled }}
          startupProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.queryApi.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.queryApi.probes.readiness.enabled }}
          readinessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.queryApi.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.queryApi.probes.liveness.enabled }}
          livenessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.queryApi.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
      volumes:
        - name: rush-config
          configMap:
            name: {{ include "rush.fullname" . }}-rush-config
        - name: rush-spool
          emptyDir: {}
        - name: audit-spool
          {{- if .Values.queryApi.auditSpoolPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.queryApi.auditSpoolPersistence.existingClaim | default (printf "%s-query-api-audit" (include "rush.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $.Values.queryApi)) }}
        {{- . | nindent 8 }}
        {{- end }}
