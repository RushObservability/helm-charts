{{- if .Values.enterprise.kubernetesAccessGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
spec:
  type: {{ .Values.enterprise.kubernetesAccessGateway.service.type }}
  ports:
    - name: https
      port: {{ .Values.enterprise.kubernetesAccessGateway.service.port }}
      targetPort: https
      {{- with .Values.enterprise.kubernetesAccessGateway.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "rush.selectorLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
{{- end }}
