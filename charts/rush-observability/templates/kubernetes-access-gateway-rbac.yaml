{{- if and .Values.enterprise.kubernetesAccessGateway.enabled (or .Values.enterprise.kubernetesAccessGateway.rbac.createImpersonationRole .Values.enterprise.kubernetesAccessGateway.rbac.manageRoles) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway-control-plane") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  {{- if .Values.enterprise.kubernetesAccessGateway.rbac.manageRoles }}
  # Required for the opt-in Settings-driven RBAC reconciler. Kubernetes checks
  # bind on referenced roles and escalate when a custom ClusterRole is applied.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway-control-plane") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway-control-plane") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.enterprise.kubernetesAccessGateway "component" "kubernetes-access-gateway") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
