{{- if and .Values.kubernetesAccessGateway.enabled .Values.kubernetesAccessGateway.rbac.createImpersonationRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway-impersonation") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway-impersonation") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "kubernetes-access-gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rush.componentName" (dict "root" . "component" "kubernetes-access-gateway-impersonation") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.kubernetesAccessGateway "component" "kubernetes-access-gateway") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
