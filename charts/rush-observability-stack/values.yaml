# -- Start here. `rush` contains the API, UI, ClickHouse, ingress, and integration
# settings. The stack defaults are sized for a development or evaluation
# cluster: standalone ClickHouse, a 20 GiB volume, and localhost access.
# Production examples are documented in docs/getting-started.md.
#
# Most installations only change:
#   rush.queryApi, rush.clickhouse,
#   global.scheduling, collectors, and metricsAgent.extraLabels.
rush:
  queryApi:
    replicas: 1
    config:
      runtime:
        environment: development
        baseUrl: http://localhost:8080
      statsEngine:
        intervalSecs: 15
      promql:
        lookbackSecs: 300
      secrets:
        existingSecret: ""
      retention:
        defaults:
          metricsDays: 30
          tracesDays: 30
          logsDays: 30
        metrics: []
        traces: []
        enforcer:
          enabled: true
          intervalSeconds: 3600
          dryRun: false
    integrations:
      sreAgent:
        # -- Optional investigation service. Provider credentials remain in Query API;
        # the agent receives only short-lived requests and its internal token.
        enabled: false
        inheritGlobalScheduling: true
        scheduling: {}
        podAnnotations: {}
        podLabels: {}
        imagePullSecrets: []
        priorityClassName: ""
        runtimeClassName: ""
        extraEnvFrom: []
        extraVolumes: []
        extraVolumeMounts: []
        serviceAccount:
          create: true
          name: ""
          annotations: {}
        image:
          repository: ghcr.io/rushobservability/sre-agent
          tag: "0.1.2"
          digest: ""
          pullPolicy: IfNotPresent
        replicas: 1
        port: 8081
        rollout:
          strategy: RollingUpdate
          maxUnavailable: 0
          maxSurge: 1
          minReadySeconds: 0
          progressDeadlineSeconds: 600
          revisionHistoryLimit: 10
        podDisruptionBudget:
          enabled: false
          type: maxUnavailable
          value: 1
        probes:
          startup:
            enabled: true
            path: /healthz
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
            successThreshold: 1
          readiness:
            enabled: true
            path: /healthz
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          liveness:
            enabled: true
            path: /healthz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
        internalAuthToken: ""
        env:
          RUST_LOG: sre_agent=info,tower_http=info
        kube:
          tenantNamespaces: {}
          allowClusterScopedForAdmins: false
        githubApp:
          enabled: false
          appId: ""
          apiUrl: https://api.github.com
          tenantRepositories: {}
          privateKeySecret:
            name: ""
            key: private-key.pem
          cacheSizeLimit: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        podSecurityContext:
          runAsNonRoot: true
          fsGroup: 65532
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        service:
          type: ClusterIP
          port: 8081
        networkPolicy:
          enabled: true
          allowExternalHttpsEgress: false
          extraIngress: []
          extraEgress: []
      kubernetes:
        enabled: false
      argocd:
        enabled: false
        namespace: argocd
      fluxcd:
        enabled: false
        namespace: flux-system
    ingress:
      enabled: false
      className: ""
      frontend:
        host: ""
        tls:
          enabled: true
          secretName: ""
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  clickhouse:
    mode: standalone
    # -- Helm dependency gate. Keep false for standalone/external and set true
    # with mode=operator.
    enabled: false
    fullnameOverride: ""
    external:
      url: ""
      credentialsSecret: ""
      userKey: user
      passwordKey: password
    clickhouse:
      resources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi
  clickhouseStandalone:
    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi
  enterprise:
    license:
      enabled: false
      secret:
        name: rush-license
        key: license-key
  imageSecurity:
    requireDigests: false
# -- Shared Kubernetes defaults inherited by application and collector workloads.
global:
  image:
    # -- Optional registry mirror for images rendered by the Rush charts.
    # Example: mirror.example.com or mirror.example.com/dockerhub
    registry: ""
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  imagePullSecrets: []
  priorityClassName: ""
  runtimeClassName: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    annotations: {}
  # -- Stack plumbing. Leave stack, ingress component names, and service details
  # unchanged. ingestApiKeySecret may point to an externally managed Secret.
  rush:
    stack:
      enabled: true
    queryApiIngressComponents:
      - otel-collector
      - vector
      - postgres-collector
      - mysql-collector
      - metrics-agent
    queryApi:
      # -- Blank resolves to <release>-query-api.
      serviceName: ""
      port: 8080
    # -- Rush ingest-only API key shared by Query API, OTel Collector, Vector, and
    # metrics-agent. By default Helm generates and registers it automatically.
    ingestApiKeySecret:
      # -- Generate <release>-ingest on first install and preserve it on upgrades.
      # Set false only for anonymous ingest or when no authenticated add-on is used.
      autoGenerate: true
      # -- Set a name to use an externally managed Secret instead.
      name: ""
      key: api-key
      # -- Optional explicit key. This creates the chart-managed Secret and takes
      # precedence over automatic generation. It is stored in release history.
      value: ""
# -- Telemetry collection. Hybrid means OTel receives traces and metrics while
# Vector tails Kubernetes logs. Set mode to none to use external collectors.
collectors:
  mode: hybrid # none | otel | vector | hybrid
  allowAnonymousIngest: false
  otel:
    inheritGlobalScheduling: true
    scheduling: {}
    podAnnotations: {}
    podLabels: {}
    imagePullSecrets: []
    priorityClassName: ""
    runtimeClassName: ""
    extraEnvFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    serviceAccount:
      create: false
      name: ""
      annotations: {}
    rollout:
      strategy: RollingUpdate
      maxUnavailable: 0
      maxSurge: 1
      minReadySeconds: 0
      progressDeadlineSeconds: 600
      revisionHistoryLimit: 10
    podDisruptionBudget:
      enabled: false
      type: maxUnavailable
      value: 1
    networkPolicy:
      enabled: true
      allowSameNamespaceIngress: true
      extraIngress: []
      extraEgress: []
    probes:
      startup:
        enabled: true
        path: /
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 60
        successThreshold: 1
      readiness:
        enabled: true
        path: /
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1
      liveness:
        enabled: true
        path: /
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.160.0"
      digest: ""
      pullPolicy: IfNotPresent
    kind: deployment
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    signals:
      traces: true
      metrics: true
      logs: false
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    service:
      type: ClusterIP
      grpcPort: 4317
      httpPort: 4318
    configOverride: ""
  vector:
    inheritGlobalScheduling: true
    scheduling: {}
    podAnnotations: {}
    podLabels: {}
    imagePullSecrets: []
    priorityClassName: ""
    runtimeClassName: ""
    extraEnvFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    serviceAccount:
      create: true
      name: ""
      annotations: {}
    rollout:
      strategy: RollingUpdate
      maxUnavailable: 1
      maxSurge: 0
      minReadySeconds: 0
      revisionHistoryLimit: 10
    podDisruptionBudget:
      enabled: false
      type: maxUnavailable
      value: 1
    networkPolicy:
      enabled: true
      allowSameNamespaceIngress: true
      allowExternalHttpsEgress: true
      extraIngress: []
      extraEgress: []
    image:
      repository: timberio/vector
      tag: "0.56.0-distroless-libc"
      digest: ""
      pullPolicy: IfNotPresent
    mode: logs # logs | full-otel
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    hostPath:
      varLog: /var/log
      varLibDockerContainers: /var/lib/docker/containers
    configOverride: ""
# -- Prometheus-compatible target discovery and remote write.
metricsAgent:
  enabled: true
  nameOverride: metrics-agent
  rushRemoteWrite:
    enabled: true
    url: ""
    allowAnonymous: false
  extraLabels:
    env: dev
enterprise:
  # -- Paid PostgreSQL diagnostics. Requires rush.enterprise.license and a
  # Secret containing the database DSN and Rush ingest key.
  postgresCollector:
    enabled: false
    inheritGlobalScheduling: true
    scheduling: {}
    podAnnotations: {}
    podLabels: {}
    imagePullSecrets: []
    priorityClassName: ""
    runtimeClassName: ""
    extraEnvFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    serviceAccount:
      create: false
      name: ""
      annotations: {}
    rollout:
      strategy: Recreate
      minReadySeconds: 0
      progressDeadlineSeconds: 600
      revisionHistoryLimit: 10
    podDisruptionBudget:
      enabled: false
      type: maxUnavailable
      value: 1
    networkPolicy:
      enabled: true
      extraIngress: []
      extraEgress: []
    image:
      repository: mzupan/postgres-collector
      tag: "0.1.0"
      digest: ""
      pullPolicy: IfNotPresent
    secret:
      name: rush-pg-collector
      dsnKey: dsn
      apiKeyKey: api-key
    env:
      COLLECTOR_ENVIRONMENT: production
      RUST_LOG: info
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "500m"
        memory: 256Mi
  # -- Paid MySQL diagnostics. Requires rush.enterprise.license and a Secret
  # containing the database DSN and Rush ingest key.
  mysqlCollector:
    enabled: false
    inheritGlobalScheduling: true
    scheduling: {}
    podAnnotations: {}
    podLabels: {}
    imagePullSecrets: []
    priorityClassName: ""
    runtimeClassName: ""
    extraEnvFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    serviceAccount:
      create: false
      name: ""
      annotations: {}
    rollout:
      strategy: Recreate
      minReadySeconds: 0
      progressDeadlineSeconds: 600
      revisionHistoryLimit: 10
    podDisruptionBudget:
      enabled: false
      type: maxUnavailable
      value: 1
    networkPolicy:
      enabled: true
      extraIngress: []
      # -- Required when NetworkPolicy is enabled. Permit TCP 3306 only to the
      # monitored database CIDR or namespace/pod selector.
      extraEgress: []
    image:
      repository: mzupan/mysql-collector
      tag: "0.1.0"
      digest: ""
      pullPolicy: IfNotPresent
    secret:
      name: rush-mysql-collector
      dsnKey: dsn
      apiKeyKey: api-key
    env:
      COLLECTOR_ENVIRONMENT: production
      COLLECTOR_INCLUDE_ERROR_TEXT: "false"
      RUST_LOG: info
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "500m"
        memory: 256Mi
