{{- if and (include "rush.stackSreMetricsEnabled" .) (not .Values.metricsAgent.sreMetrics.tokenSecret.name) }}
{{- $name := include "rush.stackSreMetricsSecretName" . }}
{{- $key := .Values.metricsAgent.sreMetrics.tokenSecret.key }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if $secret }}
{{- $token = index $secret.data $key | default "" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "sre-agent") | nindent 4 }}
type: Opaque
data:
  {{ $key | quote }}: {{ $token | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
