{{- if .Values.global.sreAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.sreAgentServiceName" . }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "sre-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.global.sreAgent.replicas }}
  {{- include "rush.deploymentRollout" (dict "rollout" .Values.global.sreAgent.rollout) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.global.sreAgent)) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.global.sreAgent)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" .Values.global.sreAgent) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.global.sreAgent) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.global.sreAgent "component" "sre-agent") }}
      automountServiceAccountToken: {{ or (not (empty .Values.global.sreAgent.kube.tenantNamespaces)) .Values.global.sreAgent.kube.allowClusterScopedForAdmins (index .Values "rush-observability").kubernetes.enabled (index .Values "rush-observability").argocd.enabled (index .Values "rush-observability").fluxcd.enabled }}
      securityContext:
        {{- toYaml .Values.global.sreAgent.podSecurityContext | nindent 8 }}
      containers:
        - name: sre-agent
          image: {{ include "rush.image" (dict "image" .Values.global.sreAgent.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.global.sreAgent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.global.sreAgent.port }}
          {{- $bootstrapSecret := (index .Values "rush-observability").queryApi.existingSecret | default (printf "%s-bootstrap" (include "rush.fullname" .)) }}
          env:
            - name: SRE_AGENT_PORT
              value: {{ .Values.global.sreAgent.port | quote }}
            - name: SRE_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: sre-agent-internal-token
            {{- include "rush.stackClickhouseWriteEnv" . | nindent 12 }}
            - name: CLICKHOUSE_DATABASE
              value: observability
            # URL of query-api used to fetch user-defined custom skills.
            # query-api owns the custom_skills table; sre-agent is a read-only
            # HTTP consumer so the two services don't need a shared volume.
            - name: QUERY_API_URL
              value: {{ include "rush.stackQueryApiUrl" . | quote }}
            {{- if .Values.global.sreAgent.githubApp.enabled }}
            - name: GITHUB_APP_ID
              value: {{ required "sreAgent.githubApp.appId is required when GitHub App access is enabled" .Values.global.sreAgent.githubApp.appId | quote }}
            - name: SRE_AGENT_GITHUB_REPOSITORY_POLICY
              value: {{ .Values.global.sreAgent.githubApp.tenantRepositories | toJson | quote }}
            - name: GITHUB_API_URL
              value: {{ .Values.global.sreAgent.githubApp.apiUrl | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /var/run/rush-github/private-key.pem
            - name: REPOSITORY_CACHE_DIR
              value: /var/run/rush-repositories
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.global.sreAgent.llmApiKeySecret.name }}
                  name: {{ .Values.global.sreAgent.llmApiKeySecret.name }}
                  key: {{ .Values.global.sreAgent.llmApiKeySecret.key }}
                  {{- else }}
                  name: {{ include "rush.fullname" . }}-sre-agent-llm
                  key: api-key
                  {{- end }}
            {{- if (index .Values "rush-observability").argocd.enabled }}
            - name: ARGOCD_NAMESPACE
              value: {{ (index .Values "rush-observability").argocd.namespace | quote }}
            {{- end }}
            {{- if (index .Values "rush-observability").fluxcd.enabled }}
            - name: FLUXCD_NAMESPACE
              value: {{ (index .Values "rush-observability").fluxcd.namespace | quote }}
            {{- end }}
            {{- if (index .Values "rush-observability").kubernetes.enabled }}
            - name: KUBERNETES_ENABLED
              value: "true"
            {{- end }}
            - name: SRE_AGENT_KUBE_TENANT_NAMESPACES
              value: {{ .Values.global.sreAgent.kube.tenantNamespaces | toJson | quote }}
            - name: SRE_AGENT_KUBE_ALLOW_CLUSTER_SCOPED
              value: {{ .Values.global.sreAgent.kube.allowClusterScopedForAdmins | quote }}
            {{- range $key, $val := .Values.global.sreAgent.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.global.sreAgent) | nindent 10 }}
          resources:
            {{- toYaml .Values.global.sreAgent.resources | nindent 12 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
          {{- if .Values.global.sreAgent.githubApp.enabled }}
          volumeMounts:
            - name: github-app-private-key
              mountPath: /var/run/rush-github
              readOnly: true
            - name: repository-cache
              mountPath: /var/run/rush-repositories
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $.Values.global.sreAgent)) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if and (not .Values.global.sreAgent.githubApp.enabled) (include "rush.extraVolumeMounts" (dict "root" . "workload" .Values.global.sreAgent)) }}
          volumeMounts:
            {{- include "rush.extraVolumeMounts" (dict "root" . "workload" .Values.global.sreAgent) | nindent 12 }}
          {{- end }}
          {{- if .Values.global.sreAgent.probes.startup.enabled }}
          startupProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.global.sreAgent.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.global.sreAgent.probes.readiness.enabled }}
          readinessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.global.sreAgent.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if .Values.global.sreAgent.probes.liveness.enabled }}
          livenessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.global.sreAgent.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
      {{- if .Values.global.sreAgent.githubApp.enabled }}
      volumes:
        - name: github-app-private-key
          secret:
            secretName: {{ required "sreAgent.githubApp.privateKeySecret.name is required when GitHub App access is enabled" .Values.global.sreAgent.githubApp.privateKeySecret.name }}
            items:
              - key: {{ .Values.global.sreAgent.githubApp.privateKeySecret.key }}
                path: private-key.pem
                mode: 0440
        - name: repository-cache
          emptyDir:
            sizeLimit: {{ .Values.global.sreAgent.githubApp.cacheSizeLimit }}
      {{- end }}
      {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $.Values.global.sreAgent)) }}
        {{- if not $.Values.global.sreAgent.githubApp.enabled }}
      volumes:
        {{- end }}
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
