{{- $integrations := .Values.rush.queryApi.integrations -}}
{{- $sreAgent := $integrations.sreAgent -}}
{{- if $sreAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.sreAgentServiceName" . }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "sre-agent") | nindent 4 }}
spec:
  replicas: {{ $sreAgent.replicas }}
  {{- include "rush.deploymentRollout" (dict "rollout" $sreAgent.rollout) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $sreAgent)) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $sreAgent)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" $sreAgent) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" $sreAgent) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" $sreAgent "component" "sre-agent") }}
      automountServiceAccountToken: {{ or (not (empty $sreAgent.kube.tenantNamespaces)) $sreAgent.kube.allowClusterScopedForAdmins $integrations.kubernetes.enabled $integrations.argocd.enabled $integrations.fluxcd.enabled }}
      securityContext:
        {{- toYaml $sreAgent.podSecurityContext | nindent 8 }}
      containers:
        - name: sre-agent
          image: {{ include "rush.image" (dict "root" . "image" $sreAgent.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $sreAgent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $sreAgent.port }}
          {{- $bootstrapSecret := .Values.rush.queryApi.config.secrets.existingSecret | default (printf "%s-bootstrap" (include "rush.fullname" .)) }}
          env:
            - name: SRE_AGENT_PORT
              value: {{ $sreAgent.port | quote }}
            - name: SRE_AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: sre-agent-internal-token
            # The agent reads telemetry and configuration through query-api.
            # It never receives ClickHouse credentials.
            - name: QUERY_API_URL
              value: {{ include "rush.stackQueryApiUrl" . | quote }}
            {{- if $sreAgent.githubApp.enabled }}
            - name: GITHUB_APP_ID
              value: {{ required "queryApi.integrations.sreAgent.githubApp.appId is required when GitHub App access is enabled" $sreAgent.githubApp.appId | quote }}
            - name: SRE_AGENT_GITHUB_REPOSITORY_POLICY
              value: {{ $sreAgent.githubApp.tenantRepositories | toJson | quote }}
            - name: GITHUB_API_URL
              value: {{ $sreAgent.githubApp.apiUrl | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /var/run/rush-github/private-key.pem
            - name: REPOSITORY_CACHE_DIR
              value: /var/run/rush-repositories
            {{- end }}
            {{- if $integrations.argocd.enabled }}
            - name: ARGOCD_NAMESPACE
              value: {{ $integrations.argocd.namespace | quote }}
            {{- end }}
            {{- if $integrations.fluxcd.enabled }}
            - name: FLUXCD_NAMESPACE
              value: {{ $integrations.fluxcd.namespace | quote }}
            {{- end }}
            {{- if $integrations.kubernetes.enabled }}
            - name: KUBERNETES_ENABLED
              value: "true"
            {{- end }}
            - name: SRE_AGENT_KUBE_TENANT_NAMESPACES
              value: {{ $sreAgent.kube.tenantNamespaces | toJson | quote }}
            - name: SRE_AGENT_KUBE_ALLOW_CLUSTER_SCOPED
              value: {{ $sreAgent.kube.allowClusterScopedForAdmins | quote }}
            {{- range $key, $val := $sreAgent.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" $sreAgent) | nindent 10 }}
          resources:
            {{- toYaml $sreAgent.resources | nindent 12 }}
          securityContext:
            {{- include "rush.hardenedContainerSecurityContext" . | nindent 12 }}
          {{- if $sreAgent.githubApp.enabled }}
          volumeMounts:
            - name: github-app-private-key
              mountPath: /var/run/rush-github
              readOnly: true
            - name: repository-cache
              mountPath: /var/run/rush-repositories
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $sreAgent)) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if and (not $sreAgent.githubApp.enabled) (include "rush.extraVolumeMounts" (dict "root" . "workload" $sreAgent)) }}
          volumeMounts:
            {{- include "rush.extraVolumeMounts" (dict "root" . "workload" $sreAgent) | nindent 12 }}
          {{- end }}
          {{- if $sreAgent.probes.startup.enabled }}
          startupProbe:
            {{- include "rush.httpProbe" (dict "probe" $sreAgent.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if $sreAgent.probes.readiness.enabled }}
          readinessProbe:
            {{- include "rush.httpProbe" (dict "probe" $sreAgent.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if $sreAgent.probes.liveness.enabled }}
          livenessProbe:
            {{- include "rush.httpProbe" (dict "probe" $sreAgent.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
      {{- if $sreAgent.githubApp.enabled }}
      volumes:
        - name: github-app-private-key
          secret:
            secretName: {{ required "queryApi.integrations.sreAgent.githubApp.privateKeySecret.name is required when GitHub App access is enabled" $sreAgent.githubApp.privateKeySecret.name }}
            items:
              - key: {{ $sreAgent.githubApp.privateKeySecret.key }}
                path: private-key.pem
                mode: 0440
        - name: repository-cache
          emptyDir:
            sizeLimit: {{ $sreAgent.githubApp.cacheSizeLimit }}
      {{- end }}
      {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $sreAgent)) }}
        {{- if not $sreAgent.githubApp.enabled }}
      volumes:
        {{- end }}
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
