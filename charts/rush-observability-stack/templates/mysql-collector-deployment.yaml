{{- if .Values.mysqlCollector.enabled }}
# Paid MySQL diagnostics. One replica prevents duplicate interval deltas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "mysql-collector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "mysql-collector") | nindent 4 }}
spec:
  replicas: 1
  {{- include "rush.deploymentRollout" (dict "rollout" .Values.mysqlCollector.rollout) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "mysql-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "mysql-collector") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.mysqlCollector)) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.mysqlCollector)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" .Values.mysqlCollector) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.mysqlCollector) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.mysqlCollector "component" "mysql-collector") }}
      automountServiceAccountToken: false
      containers:
        - name: mysql-collector
          image: {{ include "rush.image" (dict "image" .Values.mysqlCollector.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.mysqlCollector.image.pullPolicy }}
          env:
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysqlCollector.secret.name }}
                  key: {{ .Values.mysqlCollector.secret.dsnKey }}
            - name: RUSH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysqlCollector.secret.name }}
                  key: {{ .Values.mysqlCollector.secret.apiKeyKey }}
            - name: RUSH_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rush.enterprise.license.secret.name }}
                  key: {{ .Values.rush.enterprise.license.secret.key }}
            - name: RUSH_OTLP_ENDPOINT
              value: {{ include "rush.stackQueryApiUrl" . | quote }}
            {{- range $key, $value := .Values.mysqlCollector.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.mysqlCollector) | nindent 10 }}
          {{- with (include "rush.extraVolumeMounts" (dict "root" . "workload" .Values.mysqlCollector)) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.mysqlCollector.resources | nindent 12 }}
      {{- with (include "rush.extraVolumes" (dict "root" . "workload" .Values.mysqlCollector)) }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
