{{- if and .Values.rush.queryApi.config.integrations.sreAgent.enabled .Values.rush.queryApi.config.integrations.sreAgent.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.sreAgentServiceName" . }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "sre-agent") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "sre-agent") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    {{- with .Values.rush.queryApi.config.integrations.sreAgent.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    {{- if .Values.rush.queryApi.config.integrations.sreAgent.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.rush.queryApi.config.integrations.sreAgent.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
