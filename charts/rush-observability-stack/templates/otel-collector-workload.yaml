{{- if include "rush.stackOtelEnabled" . }}
{{- $isDaemonSet := eq .Values.collectors.otel.kind "daemonset" -}}
apiVersion: apps/v1
kind: {{ if $isDaemonSet }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "otel-collector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  {{- if $isDaemonSet }}
  {{- include "rush.daemonSetRollout" (dict "rollout" .Values.collectors.otel.rollout) | nindent 2 }}
  {{- else }}
  {{- include "rush.deploymentRollout" (dict "rollout" .Values.collectors.otel.rollout) | nindent 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  {{- if and (not $isDaemonSet) (not .Values.collectors.otel.autoscaling.enabled) }}
  replicas: {{ .Values.collectors.otel.replicas }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.collectors.otel)) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
        {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.collectors.otel)) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" .Values.collectors.otel) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.collectors.otel) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.collectors.otel "component" "otel-collector") }}
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: {{ include "rush.image" (dict "image" .Values.collectors.otel.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.collectors.otel.image.pullPolicy }}
          args:
            - "--config=/etc/otelcol/collector.yaml"
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.collectors.otel.service.grpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.collectors.otel.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          {{- if (include "rush.stackIngestApiKeySecretName" .) }}
          env:
            - name: RUSH_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rush.stackIngestApiKeySecretName" . }}
                  key: {{ .Values.global.rush.ingestApiKeySecret.key }}
          {{- else if not .Values.collectors.allowAnonymousIngest }}
          {{- fail "global.rush.ingestApiKeySecret.name or value is required when an in-cluster collector is enabled" }}
          {{- end }}
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.collectors.otel) | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $.Values.collectors.otel)) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.collectors.otel.resources | nindent 12 }}
          {{- if .Values.collectors.otel.probes.startup.enabled }}
          startupProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.collectors.otel.probes.startup "port" 13133) | nindent 12 }}
          {{- end }}
          {{- if .Values.collectors.otel.probes.readiness.enabled }}
          readinessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.collectors.otel.probes.readiness "port" 13133) | nindent 12 }}
          {{- end }}
          {{- if .Values.collectors.otel.probes.liveness.enabled }}
          livenessProbe:
            {{- include "rush.httpProbe" (dict "probe" .Values.collectors.otel.probes.liveness "port" 13133) | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rush.componentName" (dict "root" . "component" "otel-collector") }}
            items:
              - key: collector.yaml
                path: collector.yaml
        {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $.Values.collectors.otel)) }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
