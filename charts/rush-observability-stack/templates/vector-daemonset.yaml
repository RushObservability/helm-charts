{{- if include "rush.stackVectorEnabled" . }}
{{- $fullName := include "rush.fullname" . -}}
{{- $fullOtel := include "rush.stackVectorFullOtel" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "vector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "vector") | nindent 4 }}
spec:
  {{- include "rush.daemonSetRollout" (dict "rollout" .Values.collectors.vector.rollout) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "vector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rush.selectorLabels" (dict "root" . "component" "vector") | nindent 8 }}
        {{- with (include "rush.podLabels" (dict "root" $ "workload" $.Values.collectors.vector)) }}
        {{- . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/vector-configmap.yaml") . | sha256sum }}
        {{- with (include "rush.podAnnotations" (dict "root" $ "workload" $.Values.collectors.vector)) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "rush.workloadScheduling" (dict "root" . "workload" .Values.collectors.vector) | nindent 6 }}
      {{- include "rush.podSpecOptions" (dict "root" . "workload" .Values.collectors.vector) | nindent 6 }}
      serviceAccountName: {{ include "rush.serviceAccountName" (dict "root" . "workload" .Values.collectors.vector "component" "vector") }}
      automountServiceAccountToken: true
      # The kubernetes_logs source needs host access to container stdout/err.
      terminationGracePeriodSeconds: 30
      containers:
        - name: vector
          image: {{ include "rush.image" (dict "image" .Values.collectors.vector.image "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.collectors.vector.image.pullPolicy }}
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            {{- if .Values.global.rush.ingestApiKeySecret.name }}
            - name: RUSH_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.rush.ingestApiKeySecret.name }}
                  key: {{ .Values.global.rush.ingestApiKeySecret.key }}
            {{- else if not .Values.collectors.allowAnonymousIngest }}
            {{- fail "global.rush.ingestApiKeySecret.name is required when an in-cluster collector is enabled" }}
            {{- end }}
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_SELF_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- include "rush.extraEnvFrom" (dict "root" . "workload" .Values.collectors.vector) | nindent 10 }}
          ports:
            - name: api
              containerPort: 8686
              protocol: TCP
            {{- if $fullOtel }}
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: var-log
              mountPath: {{ .Values.collectors.vector.hostPath.varLog }}
              readOnly: true
            - name: var-lib-docker-containers
              mountPath: {{ .Values.collectors.vector.hostPath.varLibDockerContainers }}
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            {{- with (include "rush.extraVolumeMounts" (dict "root" $ "workload" $.Values.collectors.vector)) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.collectors.vector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullName }}-vector
            items:
              - key: vector.yaml
                path: vector.yaml
        - name: var-log
          hostPath:
            path: {{ .Values.collectors.vector.hostPath.varLog }}
        - name: var-lib-docker-containers
          hostPath:
            path: {{ .Values.collectors.vector.hostPath.varLibDockerContainers }}
        - name: data
          emptyDir: {}
        {{- with (include "rush.extraVolumes" (dict "root" $ "workload" $.Values.collectors.vector)) }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
