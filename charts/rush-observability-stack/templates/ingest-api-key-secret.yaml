{{- $config := .Values.global.rush.ingestApiKeySecret -}}
{{- $managed := or $config.value (and $config.autoGenerate (not $config.name)) -}}
{{- if $managed }}
{{- $name := include "rush.stackIngestApiKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $current := "" -}}
{{- if $existing -}}
{{-   $current = (index $existing.data $config.key | default "" | b64dec) -}}
{{- end -}}
{{- $generated := printf "rush_ing_%s" (randAlphaNum 64 | lower) -}}
{{- $apiKey := $config.value | default $current | default $generated -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "ingest") | nindent 4 }}
  annotations:
    # Query API stores only this key's HMAC. Keep the plaintext Secret so a
    # reinstall can continue using the registered credential.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $config.key }}: {{ $apiKey | b64enc | quote }}
{{- end }}
