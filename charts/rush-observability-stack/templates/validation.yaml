{{- if not (has .Values.collectors.mode (list "none" "otel" "vector" "hybrid")) -}}
{{- fail "collectors.mode must be one of: none, otel, vector, hybrid" -}}
{{- end -}}
{{- if not (has .Values.collectors.vector.mode (list "logs" "full-otel")) -}}
{{- fail "collectors.vector.mode must be one of: logs, full-otel" -}}
{{- end -}}
{{- if not (has .Values.collectors.otel.kind (list "deployment" "daemonset")) -}}
{{- fail "collectors.otel.kind must be one of: deployment, daemonset" -}}
{{- end -}}
{{- $collectorEnabled := ne .Values.collectors.mode "none" -}}
{{- $metricsNeedsKey := and .Values.metricsAgent.enabled .Values.metricsAgent.rushRemoteWrite.enabled (not .Values.metricsAgent.rushRemoteWrite.allowAnonymous) -}}
{{- $ingestSecretName := include "rush.stackIngestApiKeySecretName" . -}}
{{- if and .Values.metricsAgent.enabled (not (semverCompare ">=1.27.0-0" .Capabilities.KubeVersion.Version)) -}}
{{- fail "metricsAgent.enabled=true requires Kubernetes 1.27 or newer" -}}
{{- end -}}
{{- if and (or (and $collectorEnabled (not .Values.collectors.allowAnonymousIngest)) $metricsNeedsKey) (not $ingestSecretName) -}}
{{- fail "enable global.rush.ingestApiKeySecret.autoGenerate or set name/value for authenticated collectors or metrics-agent remote write" -}}
{{- end -}}
{{- /* The PostgreSQL and MySQL add-ons were removed until they ship. Old values
files that only carry the disabled defaults still install; enabling one fails. */ -}}
{{- with .Values.enterprise -}}
{{- if or (dig "postgresCollector" "enabled" false .) (dig "mysqlCollector" "enabled" false .) -}}
{{- fail "enterprise.postgresCollector and enterprise.mysqlCollector were removed; licensed add-ons are coming soon. Delete the enterprise block from your values." -}}
{{- end -}}
{{- end -}}
{{- if .Values.rush.imageSecurity.requireDigests -}}
{{- if and .Values.rush.queryApi.integrations.sreAgent.enabled (not .Values.rush.queryApi.integrations.sreAgent.image.digest) -}}{{- fail "rush.imageSecurity.requireDigests=true requires rush.queryApi.integrations.sreAgent.image.digest" -}}{{- end -}}
{{- if and .Values.enterprise.postgresCollector.enabled (not .Values.enterprise.postgresCollector.image.digest) -}}{{- fail "imageSecurity.requireDigests=true requires enterprise.postgresCollector.image.digest" -}}{{- end -}}
{{- if and .Values.enterprise.mysqlCollector.enabled (not .Values.enterprise.mysqlCollector.image.digest) -}}{{- fail "imageSecurity.requireDigests=true requires enterprise.mysqlCollector.image.digest" -}}{{- end -}}
{{- if and (include "rush.stackOtelEnabled" .) (not .Values.collectors.otel.image.digest) -}}{{- fail "imageSecurity.requireDigests=true requires collectors.otel.image.digest" -}}{{- end -}}
{{- if and (include "rush.stackVectorEnabled" .) (not .Values.collectors.vector.image.digest) -}}{{- fail "imageSecurity.requireDigests=true requires collectors.vector.image.digest" -}}{{- end -}}
{{- end -}}
