{{- if and .Values.postgresCollector.enabled .Values.postgresCollector.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "postgres-collector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "postgres-collector") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "postgres-collector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with .Values.postgresCollector.networkPolicy.extraIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: http }
    {{- with .Values.postgresCollector.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and (include "rush.stackOtelEnabled" .) .Values.collectors.otel.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "otel-collector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.collectors.otel.networkPolicy.allowSameNamespaceIngress }}
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: otlp-grpc }
        - { protocol: TCP, port: otlp-http }
        - { protocol: TCP, port: 8888 }
        - { protocol: TCP, port: 13133 }
    {{- end }}
    {{- with .Values.collectors.otel.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: http }
    {{- with .Values.collectors.otel.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and (include "rush.stackVectorEnabled" .) .Values.collectors.vector.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rush.componentName" (dict "root" . "component" "vector") }}
  labels:
    {{- include "rush.componentLabels" (dict "root" . "component" "vector") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rush.selectorLabels" (dict "root" . "component" "vector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.collectors.vector.networkPolicy.allowSameNamespaceIngress }}
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8686 }
        {{- if include "rush.stackVectorFullOtel" . }}
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
        {{- end }}
    {{- end }}
    {{- with .Values.collectors.vector.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "rush.selectorLabels" (dict "root" . "component" "query-api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: http }
    {{- if .Values.collectors.vector.networkPolicy.allowExternalHttpsEgress }}
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- with .Values.collectors.vector.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
